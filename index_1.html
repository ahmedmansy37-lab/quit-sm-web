<style>
:root{--bg:#12171D;--card:#1B222A;--line:#2A333D;--line2:#2A333D;--text:#EFF3F6;--muted:#8A99A8;--accent:#4FD1A5;--warn:#FF6B5B;--amber:#E8A24A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101a23;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px}
header .logo{font-weight:700;font-size:18px;margin-right:8px}
#nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.nav.on,.nav:hover{background:var(--card);color:var(--text)}

main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
h1{margin:0;font-size:28px} h3{margin:0 0 10px;font-size:17px}
.head{margin:6px 0 14px}.head.row{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px} .warn{color:var(--warn)!important} .ok{color:var(--accent)!important} .amber{color:var(--amber)!important}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{color:var(--muted);font-size:13px}
.days{display:flex;gap:6px}.day{width:34px;height:34px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--text);cursor:pointer;font:inherit}.day.on{background:var(--accent);border-color:var(--accent);color:#06231A}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.daynav div{flex:1;text-align:center}.daynav b{display:block}.daynav .link{font-size:18px}

.prayer b{display:block;font-size:18px}.prayer small{color:var(--muted)}.prayer i{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.prayer.done{background:#173A30}.prayer.done b{text-decoration:line-through}.prayer.done i{background:var(--accent);border-color:var(--accent);color:#06231A}
.prayer.late{background:#3A1F24}.prayer.late b,.prayer.late small{color:var(--warn)}.prayer.next{border-color:var(--accent)}
.bar{height:14px;border-radius:7px;background:#ffffff18;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:7px}.bar.big{height:12px;margin:6px 0}
.barrow{display:flex;align-items:center;gap:10px;margin:5px 0}.barrow span{width:110px;font-size:13px}.barrow em{font-style:normal;font-size:12px;min-width:90px;text-align:right}

.cols{display:flex;align-items:flex-end;gap:6px;height:150px}.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.cols i{width:70%;border-radius:5px 5px 0 0;display:block}.cols small{color:var(--muted);font-size:10px}

.dlg{padding:20px;display:flex;flex-direction:column;gap:8px}.dlg input#e_title,.dlg input#f_title{width:100%}
#login{max-width:460px;margin:12vh auto;text-align:center}#login .card{padding:30px}

#status{font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;border:0;font-family:inherit}
.warnpill{background:#3A1F24;color:#FF9A8E;cursor:pointer;padding:6px 12px;font-size:13px}
.week{display:flex;gap:4px;padding:6px}.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);border-radius:10px;padding:5px 0;cursor:pointer;font:inherit;font-size:11px}
.wd b{color:var(--text);font-size:15px}.wd i{width:6px;height:6px;border-radius:50%}.wd.on{background:#E8EDF2;color:#12171D}.wd.on b{color:#12171D}
.cool{display:flex;align-items:center;gap:16px}.ringbtn{position:relative;width:130px;height:130px;border:0;background:none;padding:0;cursor:pointer;color:var(--text);flex:none}
.ringbtn:disabled{cursor:not-allowed}.ringbtn svg{position:absolute;inset:0}.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:22px}.rc small{color:var(--muted)}
.qa{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.qbtn{flex:1;background:#26303A;color:var(--text);border:1px solid #34404C;border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.qbtn.active{background:#173A30;color:var(--accent);border-color:var(--accent)}
.rings{display:flex;justify-content:space-between}.ring{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:6px}.tl{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,#1B222A);border-radius:8px;padding:6px 10px;cursor:pointer}
.tl b{display:block}.tl small{color:var(--muted)}.tl.late{background:#3A1F24}.tl.late b{color:var(--warn)}.tl.done b{text-decoration:line-through;color:var(--muted)}
.prayer-tl{border:1px dashed var(--accent);border-radius:8px;padding:5px 10px;color:#7FE3C0;font-size:13px}.prayer-tl.done{opacity:.5}
.nowline{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:11px}.nowline i{flex:1;height:2px;background:var(--warn);position:relative}.nowline i:before{content:'';position:absolute;left:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.slot.free{height:auto;padding:6px 12px;font-size:12px;text-align:center}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden}.stack i{display:block;height:100%}
.tip{background:#1A2A3A;border-color:#2C4A6B;color:#9CC1FF}.clickable{cursor:pointer;border-radius:8px}.clickable:hover{background:#ffffff08}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>Quit Timer</h1>
    <p class="muted">Sign in with the same Google account you use on the phone.</p>
    <button class="gbtn" id="signin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
    <p id="loginerr" class="warn small"></p>
  </div>
</div>
<div id="app" hidden>
  <header><span class="logo">Quit Timer</span><nav id="nav"></nav><div id="acct"><span id="status" class="muted">Connecting…</span><span id="who"></span><button class="link" id="signout">Sign out</button></div></header>
  <main id="main"></main>
</div>
<script>
// ===================== Quit Timer — shared logic (same data as the Android app) =====================
// Data lives in 3 documents, exactly like the phone's local storage files:
//   quit_timer        (cigarettes, coffee, exercise, heart caches)
//   quit_timer_tasks  (tasks, prayers, repeats)
//   quit_timer_budget (expenses, income, rent)

const DATA = { quit_timer: {}, quit_timer_tasks: {}, quit_timer_budget: {} };
let WRITE = (file, key, value) => { DATA[file][key] = value; }; // replaced by the Firestore writer

const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayOf = ms => ymd(new Date(ms));
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYm = s => { const [y, m] = s.split('-').map(Number); return new Date(y, m - 1, 1); };
const addMonths = (s, n) => { const d = parseYm(s); return ymOf(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthLen = s => { const d = parseYm(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const atMinute = (dayStr, minute) => { const d = parseYmd(dayStr); d.setMinutes(minute); return d.getTime(); };
const minuteOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtMin = m => fmtTime(new Date(2000, 0, 1, Math.floor(m / 60) % 24, m % 60).getTime());
const money = v => Math.round(v).toLocaleString('en-US') + ' EGP';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const dow = dayStr => { const g = parseYmd(dayStr).getDay(); return g === 0 ? 7 : g; }; // Mon=1..Sun=7
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const jsonOr = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

// ---------------- cigarettes / coffee / exercise ----------------
const Q = () => DATA.quit_timer;
const EVT = { SMOKE: { key: 'cigarettes', label: 'Cigarette', before: 20, after: 30 }, COFFEE: { key: 'coffee', label: 'Coffee', before: 20, after: 60 } };
function events(type) { return (Q()[EVT[type].key] || '').split(',').filter(Boolean).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b); }
function saveEvents(type, list) { WRITE('quit_timer', EVT[type].key, [...list].sort((a, b) => a - b).join(',')); }
function startDate() { return Q().start_date || ymd(new Date()); }
function exerciseDays() { return new Set(Q().exercise_days || []); }
function saveExerciseDays(set) { WRITE('quit_timer', 'exercise_days', [...set].sort()); }
const BASE_MINUTES = 30, QUIT_DAY = 366;
function dayNumber(start, day) { return Math.max(0, Math.round((parseYmd(day) - parseYmd(start)) / DAY)) + 1; }
const increaseOnDay = n => n <= 90 ? 1 : n <= 180 ? 2 : n <= 270 ? 3 : 4;
const phaseOf = n => n >= QUIT_DAY ? 5 : n <= 90 ? 1 : n <= 180 ? 2 : n <= 270 ? 3 : 4;
const nextPhaseDay = n => n <= 90 ? 91 : n <= 180 ? 181 : n <= 270 ? 271 : n < QUIT_DAY ? QUIT_DAY : null;
const dateOfDay = (start, n) => ymd(addDays(parseYmd(start), n - 1));
function gapForDayNumber(n) { let g = BASE_MINUTES; for (let k = 2; k <= Math.min(n, QUIT_DAY - 1); k++) g += increaseOnDay(k); return g; }
function gapMinutes(start, day) { return gapForDayNumber(dayNumber(start, day)); }
const isQuit = (start, day) => dayNumber(start, day) >= QUIT_DAY;
function countOn(list, day) { return list.filter(t => dayOf(t) === day).length; }
function unlockAt(cigs, start, now) {
  const today = dayOf(now);
  if (isQuit(start, today)) return Infinity;
  const todays = cigs.filter(t => dayOf(t) === today);
  if (!todays.length) return null;
  const at = Math.max(...todays) + gapMinutes(start, today) * 60000;
  return now >= at ? null : at;
}

// weight (kg) per day
const WEIGHT_START = 87, WEIGHT_TARGET = 82;
function weights() { return jsonOr(Q().weights, {}); }
function saveWeight(day, kg) { const w = weights(); if (kg == null) delete w[day]; else w[day] = kg; WRITE('quit_timer', 'weights', JSON.stringify(w)); }

// ---------------- prayer times (Cairo, Egyptian General Authority) ----------------
const Prayer = (() => {
  const LAT = 30.0444, LNG = 31.2357;
  const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
  const ds = x => Math.sin(rad(x)), dc = x => Math.cos(rad(x)), dt = x => Math.tan(rad(x));
  const fa = a => a - 360 * Math.floor(a / 360), fh = a => a - 24 * Math.floor(a / 24);
  function julian(y, m, d) { if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  function sun(jd) {
    const D = jd - 2451545.0, g = fa(357.529 + 0.98560028 * D), q = fa(280.459 + 0.98564736 * D);
    const L = fa(q + 1.915 * ds(g) + 0.020 * ds(2 * g)), e = 23.439 - 0.00000036 * D;
    const RA = deg(Math.atan2(dc(e) * ds(L), dc(L))) / 15;
    return { decl: deg(Math.asin(ds(e) * ds(L))), eqt: q / 15 - fh(RA) };
  }
  return {
    NAMES: ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
    forDate(dayStr) {
      const d = parseYmd(dayStr);
      const tz = -new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTimezoneOffset() / 60;
      const jd = julian(d.getFullYear(), d.getMonth() + 1, d.getDate()) - LNG / (15 * 24);
      const mid = t => fh(12 - sun(jd + t).eqt);
      const sat = (a, t, ccw) => { const de = sun(jd + t).decl, n = mid(t); const v = (-ds(a) - ds(de) * ds(LAT)) / (dc(de) * dc(LAT)); const tt = deg(Math.acos(Math.max(-1, Math.min(1, v)))) / 15; return ccw ? n - tt : n + tt; };
      const asr = t => { const de = sun(jd + t).decl; return sat(-deg(Math.atan(1 / (1 + dt(Math.abs(LAT - de))))), t, false); };
      const adj = tz - LNG / 15;
      return [sat(19.5, 5 / 24, true), mid(12 / 24) + 1 / 60, asr(13 / 24), sat(0.833, 18 / 24, false) + 2 / 60, sat(17.5, 18 / 24, false)]
        .map(x => ((Math.round((x + adj) * 60) % 1440) + 1440) % 1440);
    }
  };
})();

// ---------------- tasks ----------------
const CATS = { WORK: { label: 'Work', color: '#6CA0FF' }, PERSONAL: { label: 'Personal', color: '#E8A24A' }, PRAYER: { label: 'Prayer', color: '#4FD1A5' }, GYM: { label: 'Gym', color: '#C084FC' }, STUDY: { label: 'Study', color: '#5EC8E5' }, READING: { label: 'Reading', color: '#F472B6' } };
const WIRD_ID = 'wird';
const TK = () => DATA.quit_timer_tasks;
function oneTasks() { return jsonOr(TK().one, []); }
function saveOne(list) { WRITE('quit_timer_tasks', 'one', JSON.stringify(list)); }
function recurring() { return jsonOr(TK().rec, []); }
function saveRec(list) { WRITE('quit_timer_tasks', 'rec', JSON.stringify(list)); }
function doneSet() { return new Set(TK().occ_done || []); }
function skipSet() { return new Set(TK().occ_skip || []); }

function seedTasksIfNeeded() {
  if (!TK().seeded) {
    const list = Prayer.NAMES.map((n, i) => ({ id: 'prayer' + i, title: n, cat: 'PRAYER', min: 0, dur: 15, days: [1, 2, 3, 4, 5, 6, 7], prayer: i }));
    list.push({ id: 'gym', title: 'Gym', cat: 'GYM', min: 22 * 60, dur: 60, days: [2, 3, 4, 5], prayer: -1 });
    saveRec(list); WRITE('quit_timer_tasks', 'seeded', true);
  }
  if (!TK().seeded_wird) {
    saveRec([...recurring(), { id: 'wird', title: 'Daily Wird', cat: 'PRAYER', min: 600, dur: 15, days: [1, 2, 3, 4, 5, 6, 7], prayer: -1 }]);
    WRITE('quit_timer_tasks', 'seeded_wird', true);
  }
}

function rollover() {
  const today = ymd(new Date());
  let changed = false;
  const list = oneTasks().map(t => {
    if (!t.done && dayOf(t.start) < today) { changed = true; return { ...t, start: atMinute(today, minuteOf(t.start)), overdue: true }; }
    return t;
  });
  if (changed) saveOne(list);
}

function occurrencesOn(day) {
  const s = parseYmd(day).getTime(), e = addDays(parseYmd(day), 1).getTime();
  const done = doneSet(), skip = skipSet(), out = [];
  for (const t of oneTasks()) if (t.start >= s && t.start < e)
    out.push({ key: 'o:' + t.id, title: t.title, cat: t.cat, start: t.start, dur: t.dur || 0, done: !!t.done, overdue: !!t.overdue, recId: null, oneId: t.id, isPrayer: t.cat === 'PRAYER', isWird: false, isSalah: false });
  const pt = Prayer.forDate(day), wd = dow(day);
  for (const r of recurring()) {
    if (!(r.days || []).includes(wd)) continue;
    const key = `r:${r.id}:${day}`;
    if (skip.has(key)) continue;
    const minute = r.prayer >= 0 && r.prayer <= 4 ? pt[r.prayer] : r.min;
    out.push({ key, title: r.title, cat: r.cat, start: atMinute(day, minute), dur: r.dur || 0, done: done.has(key), overdue: false, recId: r.id, oneId: null, isPrayer: r.cat === 'PRAYER', isWird: r.id === WIRD_ID, isSalah: String(r.id).startsWith('prayer') });
  }
  return out.sort((a, b) => a.start - b.start);
}

function dayTimeline(now) {
  const today = ymd(new Date()), occs = occurrencesOn(today);
  const items = occs.filter(o => !o.isWird);
  if (!items.length) return '<p class="muted">Nothing planned yet. Click + Add.</p>';
  let h = '', placedNow = false, prevEnd = null;
  for (const o of items) {
    if (!placedNow && o.start > now) { h += nowLine(now); placedNow = true; }
    if (prevEnd && o.start - prevEnd >= 3600000) h += `<button class="slot free" data-act="addat" data-arg="${new Date(prevEnd).getHours()}">free ${fmtDur(Math.round((o.start - prevEnd) / 60000))} · click to add</button>`;
    if (o.isPrayer) h += `<div class="tl prayer-tl ${o.done ? 'done' : ''}"><small>${fmtTime(o.start)}</small> ${esc(o.title)}</div>`;
    else h += `<div class="tl ${isLate(o, now) ? 'late' : ''} ${o.done ? 'done' : ''}" style="--c:${CATS[o.cat].color};min-height:${o.dur ? 30 + Math.min(120, o.dur) / 2 : 30}px" data-act="edit" data-arg="${o.key}"><b>${esc(o.title)}</b><small>${CATS[o.cat].label} · ${fmtTime(o.start)}${o.dur ? '–' + fmtTime(o.start + o.dur * 60000) : ''}</small></div>`;
    prevEnd = Math.max(prevEnd || 0, o.start + Math.max(o.dur, 15) * 60000);
  }
  if (!placedNow) h += nowLine(now);
  return h;
}

function vHistory() {

  const lo = Math.min(...all) - 3, hi = Math.max(...all) + 3, W = 600, H = 160, n = series[0].values.length, sx = W / Math.max(1, n - 1);
  const y = v => (H - 10) * (1 - (v - lo) / (hi - lo));

    let p = '', on = false;
    s.values.forEach((v, i) => { if (v == null) { on = false; return; } p += (on ? 'L' : 'M') + (i * sx).toFixed(1) + ',' + y(v).toFixed(1); on = true; g += `<circle cx="${i * sx}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`; });

}
function vInsights() {
  const heart = heartDays(), ex = exerciseDays(), eff = effectsAll();
  const days = []; for (let i = 59; i >= 0; i--) days.push(ymd(addDays(new Date(), -i)));
  const withH = days.slice(0, -1).filter(d => (heart[d] || {}).n > 0);
  const exD = withH.filter(d => isExerciseDay(d, ex, heart)), oth = withH.filter(d => !isExerciseDay(d, ex, heart));
  const rEx = avg(exD.map(d => heart[d].rest).filter(v => v != null)), rOt = avg(oth.map(d => heart[d].rest).filter(v => v != null));

function weightCard() {

function quickAddDialog() {

      setStatus(snap.metadata.fromCache ? "Offline · will sync later" : "Synced ✓");
      const a = document.activeElement;
      if (!document.querySelector("dialog") && !(a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName))) render();
    }, e => setStatus("Sync error: " + e.message)));
  }
  render();
});
</script>
</body>
</html>
