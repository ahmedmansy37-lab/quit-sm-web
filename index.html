<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quit Timer</title>
<meta name="theme-color" content="#14202B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%2314202B'/%3E%3Ccircle cx='54' cy='54' r='28' fill='none' stroke='%234FD1A5' stroke-width='5'/%3E%3Crect x='36' y='50' width='28' height='8' fill='%23F2F2F2'/%3E%3Crect x='64' y='50' width='8' height='8' fill='%23E8A24A'/%3E%3Crect x='33' y='50' width='3' height='8' fill='%23FF6B5B'/%3E%3C/svg%3E">
<style>
:root{--bg:#12171D;--card:#1B222A;--line:#2A333D;--line2:#2A333D;--text:#EFF3F6;--muted:#8A99A8;--accent:#4FD1A5;--warn:#FF6B5B;--amber:#E8A24A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101a23;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px}
header .logo{font-weight:700;font-size:18px;margin-right:8px}
#nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.nav.on,.nav:hover{background:var(--card);color:var(--text)}
#acct{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
h1{margin:0;font-size:28px} h3{margin:0 0 10px;font-size:17px}
.head{margin:6px 0 14px}.head.row{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px} .warn{color:var(--warn)!important} .ok{color:var(--accent)!important} .amber{color:var(--amber)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.center{text-align:center}
.big{width:240px;height:240px;border-radius:50%;border:6px solid var(--accent);background:#173A30;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px auto 10px;cursor:pointer;font:inherit;transition:transform .1s}
.big:active{transform:scale(.97)} .big b{font-size:30px} .big.locked{border-color:var(--warn);background:#2A1F25;cursor:not-allowed} .big.locked b{font-size:44px}
.big small{color:var(--muted)}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:#26303A;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
.btn{background:var(--accent);color:#06231A;border:0;border-radius:22px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.outline{background:none;color:var(--text);border:1px solid var(--muted)} .btn.wide{width:100%;margin:6px 0;padding:14px}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:6px 8px;border-radius:8px}.link:hover{background:#ffffff10}
.line{display:flex;align-items:center;gap:8px;padding:4px 0}.line>span{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.spend{margin-top:12px;background:#14202B;border-radius:14px;padding:14px;cursor:pointer}.spend b{display:block;font-size:24px}
input,select{background:#14202B;color:var(--text);border:1px solid #ffffff30;border-radius:10px;padding:9px 10px;font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.form>*{margin-bottom:8px}.form input#f_title{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{color:var(--muted);font-size:13px}
.days{display:flex;gap:6px}.day{width:34px;height:34px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--text);cursor:pointer;font:inherit}.day.on{background:var(--accent);border-color:var(--accent);color:#06231A}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.daynav div{flex:1;text-align:center}.daynav b{display:block}.daynav .link{font-size:18px}
.hours{border-top:1px solid var(--line)}
.hour{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.hour>span{width:60px;color:var(--muted);font-size:12px;padding-top:8px;flex:none}.hour>div{flex:1;display:flex;flex-direction:column;gap:6px}
.hour.now>span{color:var(--accent);font-weight:700}.hour.now .slot{border-color:var(--accent)}
.slot{height:40px;border:1px dashed #ffffff25;border-radius:10px;background:none;color:#ffffff55;text-align:left;padding:0 12px;cursor:pointer;font-size:16px}.slot:hover{background:#ffffff08;color:var(--text)}

.task .tmain{flex:1;cursor:pointer}.task small{display:block;color:var(--muted);font-size:12px}.task b{font-size:15px}
.task.late{background:#3A1F24}.task.late b,.task.late small{color:var(--warn)}.task.done b{text-decoration:line-through;color:var(--muted)}
.prayer{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:2px solid transparent;border-radius:14px;padding:16px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer;text-align:left}
.prayer b{display:block;font-size:18px}.prayer small{color:var(--muted)}.prayer i{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.prayer.done{background:#173A30}.prayer.done b{text-decoration:line-through}.prayer.done i{background:var(--accent);border-color:var(--accent);color:#06231A}
.prayer.late{background:#3A1F24}.prayer.late b,.prayer.late small{color:var(--warn)}.prayer.next{border-color:var(--accent)}
.bar{height:14px;border-radius:7px;background:#ffffff18;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:7px}.bar.big{height:12px;margin:6px 0}
.barrow{display:flex;align-items:center;gap:10px;margin:5px 0}.barrow span{width:110px;font-size:13px}.barrow em{font-style:normal;font-size:12px;min-width:90px;text-align:right}
.huge{font-size:26px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px}.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.cols i{width:70%;border-radius:5px 5px 0 0;display:block}.cols small{color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--muted);font-weight:500;text-align:left}td,th{padding:7px 6px;border-bottom:1px solid var(--line)}
.chart{width:100%;height:160px;display:block}
dialog{background:var(--card);color:var(--text);border:0;border-radius:18px;padding:0;max-width:520px;width:92%}dialog::backdrop{background:#000a}
.dlg{padding:20px;display:flex;flex-direction:column;gap:8px}.dlg input#e_title,.dlg input#f_title{width:100%}
#login{max-width:460px;margin:12vh auto;text-align:center}#login .card{padding:30px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#222;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
#status{font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;border:0;font-family:inherit}
.warnpill{background:#3A1F24;color:#FF9A8E;cursor:pointer;padding:6px 12px;font-size:13px}
.week{display:flex;gap:4px;padding:6px}.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);border-radius:10px;padding:5px 0;cursor:pointer;font:inherit;font-size:11px}
.wd b{color:var(--text);font-size:15px}.wd i{width:6px;height:6px;border-radius:50%}.wd.on{background:#E8EDF2;color:#12171D}.wd.on b{color:#12171D}
.cool{display:flex;align-items:center;gap:16px}.ringbtn{position:relative;width:130px;height:130px;border:0;background:none;padding:0;cursor:pointer;color:var(--text);flex:none}
.ringbtn:disabled{cursor:not-allowed}.ringbtn svg{position:absolute;inset:0}.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:22px}.rc small{color:var(--muted)}
.qa{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.qbtn{flex:1;background:#26303A;color:var(--text);border:1px solid #34404C;border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.qbtn.active{background:#173A30;color:var(--accent);border-color:var(--accent)}
.rings{display:flex;justify-content:space-between}.ring{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:6px}.tl{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,#1B222A);border-radius:8px;padding:6px 10px;cursor:pointer}
.tl b{display:block}.tl small{color:var(--muted)}.tl.late{background:#3A1F24}.tl.late b{color:var(--warn)}.tl.done b{text-decoration:line-through;color:var(--muted)}
.prayer-tl{border:1px dashed var(--accent);border-radius:8px;padding:5px 10px;color:#7FE3C0;font-size:13px}.prayer-tl.done{opacity:.5}
.nowline{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:11px}.nowline i{flex:1;height:2px;background:var(--warn);position:relative}.nowline i:before{content:'';position:absolute;left:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.slot.free{height:auto;padding:6px 12px;font-size:12px;text-align:center}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden}.stack i{display:block;height:100%}
.tip{background:#1A2A3A;border-color:#2C4A6B;color:#9CC1FF}.clickable{cursor:pointer;border-radius:8px}.clickable:hover{background:#ffffff08}
.task{position:relative}.task[draggable]{cursor:grab}.grip{position:absolute;left:30%;right:30%;bottom:0;height:7px;cursor:ns-resize;border-bottom:3px solid #ffffff30;border-radius:0 0 6px 6px}.grip:hover{border-color:var(--accent)}
.resizetag{position:absolute;right:8px;bottom:-22px;background:var(--accent);color:#06231A;font-size:12px;padding:2px 8px;border-radius:8px;z-index:5}
.dragging{opacity:.4}.dropover{outline:2px dashed var(--accent);outline-offset:2px;border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{background:none;border:0;color:var(--muted);padding:7px 14px;cursor:pointer;font:inherit}.seg button.on{background:var(--line);color:var(--text)}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.wcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:6px}.wcol.today{border-color:var(--accent)}
.wh{cursor:pointer;padding:2px 4px 6px;border-bottom:1px solid var(--line)}.wtask{background:#ffffff08;border-left:4px solid;border-radius:8px;padding:4px 6px;cursor:grab;font-size:13px}.wtask small{display:block;color:var(--muted);font-size:11px}.wtask.late{background:#3A1F24}.wtask.done b{text-decoration:line-through;color:var(--muted)}
.slot.paste{border-color:var(--amber);color:var(--amber);font-size:13px;margin-left:6px}.clip{border-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#06231A;padding:10px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:99}.toast.show{transform:translateX(-50%) translateY(0)}
.qbtn.crave{width:100%;margin:8px 0 0;border-color:var(--amber);color:var(--amber)}
.cols.hrs{height:70px;gap:2px}.cols.hrs small{font-size:9px}
textarea{width:100%;box-sizing:border-box;background:#0E1318;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.scrollx{overflow-x:auto}table.plan input,table.plan select{padding:4px 6px;font-size:13px;max-width:130px}table.plan tr.off{opacity:.45}table.plan .day{width:24px;height:24px;font-size:11px}
.goal .huge small{font-size:13px;font-weight:400}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>Quit Timer</h1>
    <p class="muted">Sign in with the same Google account you use on the phone.</p>
    <button class="gbtn" id="signin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
    <p id="loginerr" class="warn small"></p>
  </div>
</div>
<div id="app" hidden>
  <header><span class="logo">Quit Timer</span><nav id="nav"></nav><div id="acct"><span id="status" class="muted">Connecting…</span><span id="who"></span><button class="link" id="signout">Sign out</button></div></header>
  <main id="main"></main>
</div>
<script>
// ===================== Quit Timer — shared logic (same data as the Android app) =====================
// Data lives in 3 documents, exactly like the phone's local storage files:
//   quit_timer        (cigarettes, coffee, exercise, heart caches)
//   quit_timer_tasks  (tasks, prayers, repeats)
//   quit_timer_budget (expenses, income, rent)

const DATA = { quit_timer: {}, quit_timer_tasks: {}, quit_timer_budget: {} };
let WRITE = (file, key, value) => { DATA[file][key] = value; }; // replaced by the Firestore writer

const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayOf = ms => ymd(new Date(ms));
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYm = s => { const [y, m] = s.split('-').map(Number); return new Date(y, m - 1, 1); };
const addMonths = (s, n) => { const d = parseYm(s); return ymOf(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthLen = s => { const d = parseYm(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const atMinute = (dayStr, minute) => { const d = parseYmd(dayStr); d.setMinutes(minute); return d.getTime(); };
const minuteOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtMin = m => fmtTime(new Date(2000, 0, 1, Math.floor(m / 60) % 24, m % 60).getTime());
const money = v => Math.round(v).toLocaleString('en-US') + ' EGP';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const dow = dayStr => { const g = parseYmd(dayStr).getDay(); return g === 0 ? 7 : g; }; // Mon=1..Sun=7
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const jsonOr = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

// ---------------- cigarettes / coffee / exercise ----------------
const Q = () => DATA.quit_timer;
const EVT = { SMOKE: { key: 'cigarettes', label: 'Cigarette', before: 20, after: 30 }, COFFEE: { key: 'coffee', label: 'Coffee', before: 20, after: 60 } };
function events(type) { return (Q()[EVT[type].key] || '').split(',').filter(Boolean).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b); }
function saveEvents(type, list) { WRITE('quit_timer', EVT[type].key, [...list].sort((a, b) => a - b).join(',')); }
function startDate() { return Q().start_date || ymd(new Date()); }
function exerciseDays() { return new Set(Q().exercise_days || []); }
function saveExerciseDays(set) { WRITE('quit_timer', 'exercise_days', [...set].sort()); }
const BASE_MINUTES = 30, QUIT_DAY = 366;
function dayNumber(start, day) { return Math.max(0, Math.round((parseYmd(day) - parseYmd(start)) / DAY)) + 1; }
const increaseOnDay = n => n <= 90 ? 1 : n <= 180 ? 2 : n <= 270 ? 3 : 4;
const phaseOf = n => n >= QUIT_DAY ? 5 : n <= 90 ? 1 : n <= 180 ? 2 : n <= 270 ? 3 : 4;
const nextPhaseDay = n => n <= 90 ? 91 : n <= 180 ? 181 : n <= 270 ? 271 : n < QUIT_DAY ? QUIT_DAY : null;
const dateOfDay = (start, n) => ymd(addDays(parseYmd(start), n - 1));
function gapForDayNumber(n) { let g = BASE_MINUTES; for (let k = 2; k <= Math.min(n, QUIT_DAY - 1); k++) g += increaseOnDay(k); return g; }
function gapMinutes(start, day) { return gapForDayNumber(dayNumber(start, day)); }
const isQuit = (start, day) => dayNumber(start, day) >= QUIT_DAY;
function countOn(list, day) { return list.filter(t => dayOf(t) === day).length; }
function unlockAt(cigs, start, now) {
  const today = dayOf(now);
  if (isQuit(start, today)) return Infinity;
  const todays = cigs.filter(t => dayOf(t) === today);
  if (!todays.length) return null;
  const at = Math.max(...todays) + gapMinutes(start, today) * 60000;
  return now >= at ? null : at;
}

// weight (kg) per day
const WEIGHT_START = 87, WEIGHT_TARGET = 82;
function weights() { return jsonOr(Q().weights, {}); }
function saveWeight(day, kg) { const w = weights(); if (kg == null) delete w[day]; else w[day] = kg; WRITE('quit_timer', 'weights', JSON.stringify(w)); }

// ---------------- prayer times (Cairo, Egyptian General Authority) ----------------
const Prayer = (() => {
  const LAT = 30.0444, LNG = 31.2357;
  const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
  const ds = x => Math.sin(rad(x)), dc = x => Math.cos(rad(x)), dt = x => Math.tan(rad(x));
  const fa = a => a - 360 * Math.floor(a / 360), fh = a => a - 24 * Math.floor(a / 24);
  function julian(y, m, d) { if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  function sun(jd) {
    const D = jd - 2451545.0, g = fa(357.529 + 0.98560028 * D), q = fa(280.459 + 0.98564736 * D);
    const L = fa(q + 1.915 * ds(g) + 0.020 * ds(2 * g)), e = 23.439 - 0.00000036 * D;
    const RA = deg(Math.atan2(dc(e) * ds(L), dc(L))) / 15;
    return { decl: deg(Math.asin(ds(e) * ds(L))), eqt: q / 15 - fh(RA) };
  }
  return {
    NAMES: ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
    forDate(dayStr) {
      const d = parseYmd(dayStr);
      const tz = -new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTimezoneOffset() / 60;
      const jd = julian(d.getFullYear(), d.getMonth() + 1, d.getDate()) - LNG / (15 * 24);
      const mid = t => fh(12 - sun(jd + t).eqt);
      const sat = (a, t, ccw) => { const de = sun(jd + t).decl, n = mid(t); const v = (-ds(a) - ds(de) * ds(LAT)) / (dc(de) * dc(LAT)); const tt = deg(Math.acos(Math.max(-1, Math.min(1, v)))) / 15; return ccw ? n - tt : n + tt; };
      const asr = t => { const de = sun(jd + t).decl; return sat(-deg(Math.atan(1 / (1 + dt(Math.abs(LAT - de))))), t, false); };
      const adj = tz - LNG / 15;
      return [sat(19.5, 5 / 24, true), mid(12 / 24) + 1 / 60, asr(13 / 24), sat(0.833, 18 / 24, false) + 2 / 60, sat(17.5, 18 / 24, false)]
        .map(x => ((Math.round((x + adj) * 60) % 1440) + 1440) % 1440);
    }
  };
})();

// ---------------- tasks ----------------
const CATS = { WORK: { label: 'Work', color: '#6CA0FF' }, PERSONAL: { label: 'Personal', color: '#E8A24A' }, PRAYER: { label: 'Prayer', color: '#4FD1A5' }, GYM: { label: 'Gym', color: '#C084FC' }, STUDY: { label: 'Study', color: '#5EC8E5' }, READING: { label: 'Reading', color: '#F472B6' } };
const WIRD_ID = 'wird';
const TK = () => DATA.quit_timer_tasks;
function oneTasks() { return jsonOr(TK().one, []); }
function saveOne(list) { WRITE('quit_timer_tasks', 'one', JSON.stringify(list)); }
function recurring() { return jsonOr(TK().rec, []); }

function checkIns(now = Date.now()) {

function balanceScore(day = ymd(new Date())) {

  const moved = exDay(day);
  parts.push({ k: 'move', name: 'Movement', got: moved ? BALANCE_W.move : 0, max: BALANCE_W.move, hint: moved ? 'Exercised ✓' : 'Not yet' });
  const occs = occurrencesOn(day), sal = occs.filter(o => o.isSalah), tk = occs.filter(o => !o.isPrayer);
  const pf = sal.length ? sal.filter(o => o.done).length / sal.length : 1, tf = tk.length ? tk.filter(o => o.done).length / tk.length : 1;
  parts.push({ k: 'tasks', name: 'Tasks & prayers', got: Math.round(BALANCE_W.tasks * (pf + tf) / 2), max: BALANCE_W.tasks, hint: `${sal.filter(o => o.done).length}/5 prayers · ${tk.filter(o => o.done).length}/${tk.length} tasks` });
  const m = day.slice(0, 7), before = expensesIn(m).filter(e => dayOf(e.time) < day).reduce((s, e) => s + e.amount, 0) + cigs.filter(t => dayOf(t).startsWith(m) && dayOf(t) < day).length * CFG.PER_CIG;
  const left = monthLen(m) - parseYmd(day).getDate() + 1, safe = Math.max(0, (budgetFor(m) - before) / left);
  const todaySpent = expensesIn(m).filter(e => dayOf(e.time) === day).reduce((s, e) => s + e.amount, 0) + countOn(cigs, day) * CFG.PER_CIG;
  const mg = todaySpent <= safe ? BALANCE_W.money : safe > 0 ? Math.round(BALANCE_W.money * safe / todaySpent) : 0;
  parts.push({ k: 'money', name: 'Budget', got: mg, max: BALANCE_W.money, hint: `${money(todaySpent)} of ${money(safe)} safe` });
  const total = parts.reduce((s, p) => s + p.got, 0);
  const weakest = parts.filter(p => p.got < p.max).sort((a, b) => (a.got / a.max) - (b.got / b.max))[0] || null;
  return { total, parts, weakest };
}

// ---- goal 1: smoking ----
function smokingGoal() {
  const cigs = events('SMOKE'), coffees = events('COFFEE'), start = startDate(), today = ymd(new Date());
  const past = d => d >= start && d < today;
  const d30 = daysBack(31).slice(0, -1).filter(past), d7 = d30.slice(-7), p7 = d30.slice(-14, -7);
  const per = l => avg(l.map(d => countOn(cigs, d)));
  const a7 = per(d7), a30 = per(d30), prev7 = per(p7);
  // projection: slope of the last 14 days
  const pts = d30.slice(-14).map((d, i) => [i, countOn(cigs, d)]);
  let zeroDate = null, slope = null;
  if (pts.length >= 5) {
    const mx = avg(pts.map(p => p[0])), my = avg(pts.map(p => p[1]));
    const num = pts.reduce((s, [x, y]) => s + (x - mx) * (y - my), 0), den = pts.reduce((s, [x]) => s + (x - mx) ** 2, 0);
    slope = den ? num / den : 0;

  }
  const quitDate = dateOfDay(start, QUIT_DAY);
  // hardest hours (last 30 days)
  const hours = Array(24).fill(0); cigs.filter(t => Date.now() - t < 30 * DAY).forEach(t => hours[new Date(t).getHours()]++);
  // triggers (last 30 days)
  const recent = cigs.filter(t => Date.now() - t < 30 * DAY);
  let afterCoffee = 0, duringWork = 0;
  const workCache = {};
  for (const t of recent) {
    if (coffees.some(c => t >= c && t - c <= 15 * 60000)) afterCoffee++;
    const d = dayOf(t); workCache[d] = workCache[d] || occurrencesOn(d).filter(o => o.cat === 'WORK' && o.dur > 0);
    if (workCache[d].some(o => t >= o.start && t <= o.start + o.dur * 60000)) duringWork++;
  }
  const n = recent.length;
  const triggers = n ? { coffee: afterCoffee / n, work: duringWork / n, free: Math.max(0, n - duringWork) / n } : null;
  // money saved vs first week
  const firstWeek = daysBack(400).filter(d => d >= start).slice(0, 7).filter(d => d < today);
  const base = firstWeek.length >= 3 ? per(firstWeek) : null;
  const allDays = daysBack(400).filter(past);
  const saved = base != null ? allDays.reduce((s, d) => s + (base - countOn(cigs, d)) * CFG.PER_CIG, 0) : null;
  // bounce-back: after a bad day (> previous 7-day avg + 1), days until back at or below that avg
  const backs = [];
  for (let i = 7; i < allDays.length; i++) {
    const ref = per(allDays.slice(i - 7, i)), c = countOn(cigs, allDays[i]);
    if (c > ref + 1) { let k = i + 1; while (k < allDays.length && countOn(cigs, allDays[k]) > ref) k++; if (k < allDays.length) backs.push(k - i); }
  }
  // coffee → cigarette
  const rc = coffees.filter(c => Date.now() - c < 30 * DAY), follow = [];
  rc.forEach(c => { const s = cigs.find(t => t >= c && t - c <= 60 * 60000); if (s) follow.push((s - c) / 60000); });
  const u = urges().filter(x => Date.now() - x.t < 7 * DAY);
  const uh = Array(24).fill(0); urges().filter(x => Date.now() - x.t < 30 * DAY).forEach(x => uh[new Date(x.t).getHours()]++);
  return { a7, a30, prev7, slope, zeroDate, quitDate, onTrack: zeroDate ? zeroDate <= quitDate : null, hours, triggers, n, saved, base, bounce: avg(backs),
    coffeeFollow: rc.length ? { pct: follow.filter(m => m <= 15).length / rc.length, median: follow.length ? follow.sort((a, b) => a - b)[Math.floor(follow.length / 2)] : null, n: rc.length } : null,
    urgesWeek: u.length, urgesPassed: u.filter(x => x.ok === true).length, urgeHours: uh };
}

// ---- goal 2: heart ----
function heartGoal() {
  const heart = heartDays(), weeks = [];
  const mon = weekStart(new Date());
  for (let w = 7; w >= 0; w--) {
    const s = addDays(mon, -7 * w), vals = [0, 1, 2, 3, 4, 5, 6].map(i => (heart[ymd(addDays(s, i))] || {}).rest).filter(v => v != null);
    weeks.push({ week: ymd(s), rest: avg(vals) });
  }
  const days = daysBack(60).slice(0, -1).filter(d => (heart[d] || {}).rest != null);
  const ex = compare(days, exDay, d => heart[d].rest);
  const eff = effectsAll(), sm = eff.filter(e => e.type === 'SMOKE' && e.delta != null), cf = eff.filter(e => e.type === 'COFFEE' && e.delta != null);
  const half = l => { const a = l.filter(e => Date.now() - e.time < 14 * DAY), b = l.filter(e => Date.now() - e.time >= 14 * DAY); return { now: avg(a.map(e => e.delta)), before: avg(b.map(e => e.delta)) }; };
  return { weeks, ex, smoke: half(sm), coffee: half(cf) };
}

// ---- goal 3: time ----
function weekMinutes(cat, monday) {
  let m = 0; const now = Date.now();
  for (let i = 0; i < 7; i++) occurrencesOn(ymd(addDays(monday, i))).forEach(o => { if (o.cat === cat && o.done && o.dur > 0 && o.start <= now) m += o.dur; });
  return m;
}
function timeGoal() {
  const mon = weekStart(new Date()), now = Date.now();
  const study = weekMinutes('STUDY', mon), reading = weekMinutes('READING', mon);
  let planned = 0, done = 0;
  for (let i = 0; i < 7; i++) occurrencesOn(ymd(addDays(mon, i))).forEach(o => { if (o.isPrayer || !o.dur) return; planned += o.dur; if (o.done) done += o.dur; });
  const weeks = [];
  for (let w = 3; w >= 0; w--) {
    const s = addDays(mon, -7 * w); let t = 0, d = 0;
    for (let i = 0; i < 7; i++) occurrencesOn(ymd(addDays(s, i))).forEach(o => { if (o.isPrayer || o.start > now) return; t++; if (o.done) d++; });
    weeks.push({ week: ymd(s), rate: t ? d / t : null });
  }
  const pp = Object.entries(postponeCounts()).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const daysLeft = 7 - ((new Date().getDay() + 6) % 7);
  return { study, reading, planned, done, weeks, postponed: pp, daysLeft };
}

// ---- goal 4: gym ----
function gymGoal() {
  const mon = weekStart(new Date()), count = s => [0, 1, 2, 3, 4, 5, 6].filter(i => { const d = ymd(addDays(s, i)); return d <= ymd(new Date()) && exDay(d); }).length;
  const thisWeek = count(mon);
  let streak = 0; for (let w = 1; w < 52; w++) { if (count(addDays(mon, -7 * w)) >= TARGETS.GYM_DAYS) streak++; else break; }
  return { thisWeek, streak };
}

// ---- goal 5: prayers & wird ----
function prayerGoal() {
  const today = ymd(new Date()), start = startDate();
  let streak = 0; const d0 = allPrayersOn(today) ? 0 : 1;
  for (let i = d0; i < 365; i++) { const d = ymd(addDays(new Date(), -i)); if (d < start) break; if (allPrayersOn(d)) streak++; else break; }
  const missed = [0, 0, 0, 0, 0]; const now = Date.now();
  daysBack(30).filter(d => d >= start).forEach(d => occurrencesOn(d).filter(o => o.isSalah && o.start < now && !o.done).forEach(o => missed[+o.recId.slice(6)]++));
  const mi = missed.indexOf(Math.max(...missed));
  const m = ymOf(new Date()), tot = wirdMonthTotal(m), tgt = wirdTarget(m), el = new Date().getDate();
  return { streak, missed, mostMissed: missed[mi] > 0 ? Prayer.NAMES[mi] : null, wird: tot, target: tgt, projected: Math.round(tot / el * monthLen(m)) };
}

// ---- goal 6: money ----
function moneyGoal() {
  const cigs = events('SMOKE'), m = ymOf(new Date()), el = new Date().getDate(), len = monthLen(m);
  const sp = spent(m, cigs), bud = budgetFor(m), projSpend = sp / el * len, projSave = bud - projSpend;
  const now = byCategory(m, cigs), prev = byCategory(addMonths(m, -1), cigs);
  let growing = null;
  for (const c of Object.keys(now)) { const pace = now[c] / el * len, p = prev[c]; if (p > 0 && pace > p * 1.15 && (!growing || pace - p > growing.diff)) growing = { cat: c, pace, prev: p, diff: pace - p }; }
  return { sp, bud, projSpend, projSave, target: TARGETS.SAVINGS, growing, history: savingsHistory(cigs) };
}

// ---- cross-goal links ----
function crossLinks() {
  const cigs = events('SMOKE'), start = startDate(), today = ymd(new Date());
  const days = daysBack(60).filter(d => d >= start && d < today);
  const c = d => countOn(cigs, d);
  const workDays = days.filter(d => workMinutesOn(d) > 0);
  return {
    exercise: { cigs: compare(days, exDay, c), gap: compare(days, exDay, d => avgGapOn(cigs, d)), done: compare(days, exDay, completionOn) },
    prayers: compare(days, allPrayersOn, c),
    tasks: compare(days.filter(d => completionOn(d) != null), d => completionOn(d) >= 0.7, c),
    work: { cigs: compare(workDays, d => workMinutesOn(d) >= 240, c), gap: compare(workDays, d => workMinutesOn(d) >= 240, d => avgGapOn(cigs, d)) },
  };
}

// ---- gentle trends ----
function trends() {
  const cigs = events('SMOKE'), start = startDate(), today = ymd(new Date());
  const past = daysBack(61).slice(0, -1).filter(d => d >= start);
  const a = l => avg(l.map(d => countOn(cigs, d)));
  return { w7: a(past.slice(-7)), w7prev: a(past.slice(-14, -7)), d30: a(past.slice(-30)), d30prev: a(past.slice(-60, -30)), today: countOn(cigs, today) };
}

// ---- personal tip using the user's own numbers ----
function personalTip() {
  const x = crossLinks(), s = smokingGoal(), today = ymd(new Date());
  if (x.exercise.gap.yes != null && x.exercise.gap.no != null && x.exercise.gap.yes - x.exercise.gap.no >= 10 && !exDay(today))
    return `On exercise days your gap between cigarettes is about ${Math.round(x.exercise.gap.yes - x.exercise.gap.no)} min longer. A light workout today could help.`;
  if (x.exercise.cigs.yes != null && x.exercise.cigs.no != null && x.exercise.cigs.no - x.exercise.cigs.yes >= 1 && !exDay(today))
    return `You smoke about ${r1(x.exercise.cigs.no - x.exercise.cigs.yes)} fewer cigarettes on exercise days. Even a 20-minute walk counts.`;
  if (s.coffeeFollow && s.coffeeFollow.pct >= 0.5) return `${Math.round(s.coffeeFollow.pct * 100)}% of your coffees are followed by a cigarette within 15 min. Have the next one with a glass of water and a short walk instead.`;
  const top = s.hours.indexOf(Math.max(...s.hours));
  if (s.n >= 10) return `Your hardest hour is around ${fmtMin(top * 60)}. Plan something for that time today: a task, a walk, or water and gum.`;
  return null;
}

// ---- short pattern summary (goes into the Plan with Claude prompt) ----
function patternSummary() {
  const s = smokingGoal(), x = crossLinks(), lines = [];
  if (s.n >= 5) { const top = s.hours.map((v, h) => [h, v]).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(p => p[1] > 0).map(p => fmtMin(p[0] * 60)); lines.push(`Hardest smoking hours: ${top.join(', ')}.`); }
  if (x.work.cigs.yes != null && x.work.cigs.no != null) lines.push(`Heavy-work days (4h+ of Work): ${r1(x.work.cigs.yes)} cigarettes vs ${r1(x.work.cigs.no)} on lighter days.`);
  if (x.exercise.cigs.yes != null && x.exercise.cigs.no != null) lines.push(`Exercise days: ${r1(x.exercise.cigs.yes)} cigarettes vs ${r1(x.exercise.cigs.no)} on other days.`);
  if (s.coffeeFollow) lines.push(`${Math.round(s.coffeeFollow.pct * 100)}% of coffees are followed by a cigarette within 15 min.`);
  if (s.urgesWeek) lines.push(`Urges logged this week: ${s.urgesWeek} (${s.urgesPassed} passed without smoking). Most urges around ${fmtMin(s.urgeHours.indexOf(Math.max(...s.urgeHours)) * 60)}.`);
  if (s.a7 != null) lines.push(`Average cigarettes per day, last 7 days: ${r1(s.a7)}. Today's required gap: ${gapMinutes(startDate(), ymd(new Date()))} min.`);
  return lines;
}

const card = (title, body, extra = '') => `<section class="card ${extra}">${title ? `<h3>${title}</h3>` : ''}${body}</section>`;

function svgLine(series, markers) {
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length) return '<p class="muted">No heart data yet. The phone reads it from Health Connect and syncs it here.</p>';
  const lo = Math.min(...all) - 3, hi = Math.max(...all) + 3, W = 600, H = 160, n = series[0].values.length, sx = W / Math.max(1, n - 1);
  const y = v => (H - 10) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (const s of series) {
    let p = '', on = false;
    s.values.forEach((v, i) => { if (v == null) { on = false; return; } p += (on ? 'L' : 'M') + (i * sx).toFixed(1) + ',' + y(v).toFixed(1); on = true; g += `<circle cx="${i * sx}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`; });
    g += `<path d="${p}" stroke="${s.color}" stroke-width="2.5" fill="none"/>`;
  }
  markers.forEach((m, i) => { if (m) g += `<circle cx="${i * sx}" cy="${H - 3}" r="3" fill="#6CA0FF"/>`; });
  return `<small class="muted">${Math.round(hi)} bpm</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart">${g}</svg><small class="muted">${Math.round(lo)} bpm</small>
  <p class="muted small">${series.map(s => `<i class="dot" style="background:${s.color}"></i> ${s.name}`).join(' &nbsp; ')} &nbsp; <i class="dot" style="background:#6CA0FF"></i> exercise day</p>`;
}
function svgDelta(list) {

  if (!data.length) return '<p class="muted">No heart-rate data around these events yet.</p>';
  const mx = Math.max(5, ...data.map(e => Math.abs(e.delta))), W = 600, H = 140, mid = H / 2, sw = W / data.length;
  const g = data.map((e, i) => { const h = Math.max(2, mid * Math.abs(e.delta) / mx), c = e.delta >= 0 ? '#FF6B5B' : '#4FD1A5'; return `<rect x="${i * sw + sw * 0.2}" y="${e.delta >= 0 ? mid - h : mid}" width="${sw * 0.6}" height="${h}" rx="3" fill="${c}" opacity="${e.mixed ? 0.35 : 1}"><title>${new Date(e.time).toLocaleString()}: ${e.delta > 0 ? '+' : ''}${e.delta.toFixed(0)} bpm</title></rect>`; }).join('');
  return `<small class="muted">+${Math.round(mx)} bpm</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart"><line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="#ffffff55" stroke-width="2"/>${g}</svg><small class="muted">−${Math.round(mx)} bpm</small>`;
}
const sgn = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1);

function weightCard() {
  const w = weights(), keys = Object.keys(w).sort(), last = keys.length ? w[keys[keys.length - 1]] : null;

  else {
    const lost = WEIGHT_START - last, left = Math.max(0, last - WEIGHT_TARGET);
    body = `<div class="stats">${stat('now', last.toFixed(1))}${stat('lost', lost.toFixed(1))}${stat('left', left.toFixed(1))}</div>
      <div class="bar big"><i style="width:${Math.max(1, Math.min(100, lost / (WEIGHT_START - WEIGHT_TARGET) * 100))}%;background:var(--accent)"></i></div>`;
    const first = keys[0], days = Math.round((parseYmd(keys[keys.length - 1]) - parseYmd(first)) / DAY);

    if (keys.length >= 2) body += svgLine([{ name: 'weight (kg)', color: '#4FD1A5', values: keys.map(k => w[k]) }], []);

  return card(`Weight · goal ${WEIGHT_TARGET} kg`, body + `<div class="row" style="margin-top:8px"><input type="number" step="0.1" placeholder="Today's weight (kg)" value="${esc(UI.weight)}" data-bind="weight.v" id="wkg"><button class="btn" data-act="saveweight">Save</button></div>`);

  const show = () => { tag.textContent = `${fmtTime(o.start)} – ${fmtTime(o.start + dur * 60000)} (${fmtDur(dur)})`; };

function freeSlots(day) {
  const occs = occurrencesOn(day).filter(o => !o.isWird), busy = occs.map(o => [o.start, o.start + Math.max(o.dur || 0, o.isPrayer ? 15 : 30) * 60000]).sort((a, b) => a[0] - b[0]);

}

const CAT_BY_LABEL = { work: 'WORK', personal: 'PERSONAL', study: 'STUDY', reading: 'READING', gym: 'GYM', health: 'GYM' };
function parsePlan(text) {
  const blocks = [...String(text).matchAll(/```(?:json|quit-timer-plan)?\s*([\s\S]*?)```/gi)].map(m => m[1]);
  if (!blocks.length) { const i = text.indexOf('['), j = text.lastIndexOf(']'); if (i >= 0 && j > i) blocks.push(text.slice(i, j + 1)); }
  for (const b of blocks.reverse()) {
    let data; try { data = JSON.parse(b.trim()); } catch (e) { continue; }
    if (!Array.isArray(data)) data = data && (data.tasks || data.schedule);
    if (!Array.isArray(data)) continue;
    const out = data.map(t => {
      const cat = CAT_BY_LABEL[String(t.category || t.cat || 'Personal').toLowerCase()] || 'PERSONAL';
      const date = /^\d{4}-\d{2}-\d{2}$/.test(t.date || t.day || '') ? (t.date || t.day) : UI.taskDay;
      const st = /^\d{1,2}:\d{2}$/.test(t.startTime || t.start || '') ? (t.startTime || t.start).padStart(5, '0') : null;
      const en = /^\d{1,2}:\d{2}$/.test(t.endTime || t.end || '') ? (t.endTime || t.end).padStart(5, '0') : '';
      const rep = (Array.isArray(t.repeat) ? t.repeat : []).map(Number).filter(n => n >= 1 && n <= 7);
      return { include: true, title: String(t.title || '').trim(), cat, date, start: st, end: en, repeat: rep };
    }).filter(t => t.title && t.start);
    if (out.length) return out;
  }
  return null;
}

}

      if (t._auto !== true && dup && t.include) { t.include = false; t._auto = true; }
      return `<tr class="${t.include ? '' : 'off'}"><td><input type="checkbox" data-pi="${i}" data-pf="include" ${t.include ? 'checked' : ''}></td>
        <td><input value="${esc(t.title)}" data-pi="${i}" data-pf="title"></td>
        <td><select data-pi="${i}" data-pf="cat">${catOptions(t.cat)}</select></td>
        <td><input type="date" value="${t.date}" data-pi="${i}" data-pf="date" ${t.repeat.length ? 'disabled' : ''}></td>
        <td><input type="time" value="${t.start}" data-pi="${i}" data-pf="start"></td><td><input type="time" value="${t.end}" data-pi="${i}" data-pf="end"></td>
        <td><div class="days">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((l, k) => `<button type="button" class="day ${t.repeat.includes(k + 1) ? 'on' : ''}" data-act="planday" data-arg="${i}:${k + 1}">${l}</button>`).join('')}</div></td>
        <td>${w.map(x => `<span class="pill ${x.dup ? '' : 'warnpill'}">${esc(x.text)}</span>`).join(' ')}</td></tr>`;
    }).join('');
    const nIn = plan.filter(t => t.include).length;
    h += card(`3 · Review (${plan.length} tasks)`, `<div class="scrollx"><table class="plan"><tr><th></th><th>Title</th><th>Category</th><th>Date</th><th>From</th><th>To</th><th>Repeat</th><th></th></tr>${rows}</table></div>
      <p class="muted small">Untick anything you don't want. Duplicates of tasks you already have are unticked automatically.</p>
      <button class="btn" data-act="applyplan" ${nIn ? '' : 'disabled'}>Add ${nIn} to schedule</button>`);
  } else h += card('3 · Review', '<p class="muted">After you paste Claude\'s answer, the tasks appear here so you can check, edit and add them.</p>');
  h += `</div></div>`;
  return h;
}
function claudeReport() {
  const s = smokingGoal(), tg = timeGoal(), gg = gymGoal(), pg = prayerGoal(), mg = moneyGoal(), tr = trends(), hg = heartGoal(), cigs = events('SMOKE'), coffees = events('COFFEE');
  const start = startDate(), today = ymd(new Date()), w = weights(), wk = Object.keys(w).sort();
  const L = [`# Quit Timer report — ${longDate(today)}`, ``, `Day ${dayNumber(start, today)} of the plan (start ${start}, quit day ${dateOfDay(start, QUIT_DAY)}).`, ``, `## Smoking`,
    `- Gap today ${gapMinutes(start, today)} min (phase ${phaseOf(dayNumber(start, today))}).`,
    `- Cigarettes/day: last 7 days ${r1(tr.w7) ?? '—'}, previous 7 ${r1(tr.w7prev) ?? '—'}, last 30 ${r1(tr.d30) ?? '—'}. Today so far ${tr.today}.`,
    `- Projected zero date: ${s.zeroDate || 'not enough data'}. Money saved vs first week: ${s.saved != null ? money(s.saved) : '—'}.`,
    `- Urges this week ${s.urgesWeek} (passed ${s.urgesPassed}).`, ...patternSummary().map(l => '- ' + l), ``, `## Last 14 days`, `| Day | Cigarettes | Coffee | Exercise | Rest HR |`, `|---|---|---|---|---|`,
    ...daysBack(14).map(d => `| ${d} | ${countOn(cigs, d)} | ${countOn(coffees, d)} | ${exDay(d) ? '✓' : ''} | ${(heartDays()[d] || {}).rest != null ? Math.round(heartDays()[d].rest) : '—'} |`),
    ``, `## Heart`, `- Resting HR by week: ${hg.weeks.map(x => x.rest != null ? Math.round(x.rest) : '—').join(', ')}.`, `- Pulse rise after a cigarette ${sgn(hg.smoke.now)} bpm (2 weeks), after coffee ${sgn(hg.coffee.now)} bpm.`,
    ``, `## Time & gym`, `- This week: Study ${fmtDur(tg.study)} / ${TARGETS.STUDY / 60}h, Reading ${fmtDur(tg.reading)} / ${TARGETS.READING / 60}h, planned ${fmtDur(tg.planned)}, done ${fmtDur(tg.done)}.`,
    `- Completion by week: ${tg.weeks.map(x => pct(x.rate)).join(', ')}. Most postponed: ${tg.postponed.map(([t, c]) => `${t} ${c}×`).join(', ') || '—'}.`,
    `- Gym this week ${gg.thisWeek}/${TARGETS.GYM_DAYS}, weeks in a row at target ${gg.streak}.`, `- Top tasks this month: ${monthMinutesByTitle().slice(0, 5).map(t => `${t.title} ${fmtDur(t.min)}`).join(', ') || '—'}.`,
    ``, `## Prayers & wird`, `- All-5 streak ${pg.streak} days. Missed in 30 days: ${Prayer.NAMES.map((n, i) => `${n} ${pg.missed[i]}`).join(', ')}.`, `- Wird ${pg.wird}/${pg.target} this month, projected ${pg.projected}.`,
    ``, `## Money`, `- Budget ${money(mg.bud)}, spent ${money(mg.sp)}, month-end pace ${money(mg.projSpend)}, projected savings ${money(mg.projSave)} (target ${money(mg.target)}).`,
    `- By category: ${Object.entries(byCategory(ymOf(new Date()), cigs)).filter(([, v]) => v > 0).map(([c, v]) => `${EXP_CATS[c][0]} ${money(v)}`).join(', ') || '—'}.`,
    ``, `## Weight`, `- ${wk.length ? wk.slice(-6).map(k => `${k}: ${w[k]} kg`).join(', ') : 'no entries'} (start ${WEIGHT_START}, goal ${WEIGHT_TARGET}).`,
    ``, `Please review my progress against my goals and suggest 3 concrete changes for next week.`];
  return L.join('\n');
}

const _render = render;
render = function () {
  if (UI.tab === 'assistant' && window.SIGNED_IN) {
    rollover();
    $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="nav ${UI.tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${l}</button>`).join('');
    $('#main').innerHTML = vAssistant(); return;
  }
  _render();
};

Object.assign(ACTIONS, {
  crave: () => cravingDialog(),
  tview: v => { UI.taskView = v; localStorage.setItem('qt_tview', v); render(); },
  copytask: k => { const o = findOcc(k); if (!o) return; UI.clip = { title: o.title, cat: o.cat, dur: o.dur, min: minuteOf(o.start) }; toast(`Copied "${o.title}"`); render(); },
  clipclear: () => { UI.clip = null; render(); },
  pasteat: hr => { const c = UI.clip; if (!c) return; addOne(c.title, c.cat, atMinute(UI.taskDay, +hr * 60), c.dur); toast(`Pasted at ${fmtMin(+hr * 60)}`); render(); },
  pasteday: d => { const c = UI.clip; if (!c) return; addOne(c.title, c.cat, atMinute(d, c.min), c.dur); toast(`Pasted on ${parseYmd(d).toLocaleDateString('en-US', { weekday: 'long' })}`); render(); },
  plan: async day => {
    if (day === 'pick') day = (document.getElementById('planday') || {}).value || UI.taskDay;
    const pr = copyText(planPrompt(day));
    window.open('https://claude.ai/new', '_blank');
    const ok = await pr;
    toast(ok ? 'Message copied — paste it in Claude (Ctrl+V)' : 'Could not copy. Try again.');
    UI.taskDay = day; UI.tab = 'assistant'; localStorage.setItem('qt_tab', 'assistant'); render();
  },
  parseplan: () => {
    const ta = document.getElementById('plantext'); UI.planText = ta ? ta.value : UI.planText;
    const p = parsePlan(UI.planText);
    if (!p) { const e = document.getElementById('planerr'); if (e) e.textContent = 'No plan found. Make sure the pasted text includes Claude\'s ```json block.'; return; }
    UI.plan = p; render();
  },
  clearplan: () => { UI.plan = null; UI.planText = ''; render(); },
  planday: a => { const [i, k] = a.split(':').map(Number); const t = UI.plan[i]; t.repeat = t.repeat.includes(k) ? t.repeat.filter(x => x !== k) : [...t.repeat, k].sort(); render(); },
  applyplan: () => {
    const sel = (UI.plan || []).filter(t => t.include && t.title && t.start); let n = 0;
    for (const t of sel) {
      const st = fromHHMM(t.start), en = fromHHMM(t.end), dur = en != null && en > st ? en - st : 0;
      if (t.repeat.length) addRecurring(t.title, t.cat, st, dur, t.repeat); else addOne(t.title, t.cat, atMinute(t.date, st), dur); n++;
    }
    UI.plan = null; UI.planText = ''; toast(`Added ${n} task${n === 1 ? '' : 's'} to your schedule ✓`); render();
  },
  report: async a => {
    const r = claudeReport();
    if (a === 'copy') { toast(await copyText(r) ? 'Report copied' : 'Could not copy'); return; }
    const blob = new Blob([r], { type: 'text/markdown' }), url = URL.createObjectURL(blob), el = document.createElement('a');
    el.href = url; el.download = `quit-timer-report-${ymd(new Date())}.md`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
});
// review table inputs
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || el.dataset.pi == null || !UI.plan) return;
  const t = UI.plan[+el.dataset.pi], f = el.dataset.pf;
  t[f] = f === 'include' ? el.checked : el.value; render();
});
document.addEventListener('input', ev => { if (ev.target.id === 'plantext') UI.planText = ev.target.value; });
// count postpones made through the dialog
const _postponeTask = postponeTask;
postponeTask = function (key, ns) { const o = findOcc(key); if (o) countPostpone(o.title); _postponeTask(key, ns); };

</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc, onSnapshot, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgVODfsYwTDfD717HH7Xkd5nfhK2Vi2y0",
  authDomain: "quit-sm-cfec3.firebaseapp.com",
  projectId: "quit-sm-cfec3",
  storageBucket: "quit-sm-cfec3.firebasestorage.app",
  messagingSenderId: "516854820795",
  appId: "1:516854820795:web:ba7d50d531a665e492de9e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch (e) { db = initializeFirestore(app, {}); }

const FILES = ["quit_timer", "quit_timer_tasks", "quit_timer_budget"];
let unsubs = [], uid = null, loaded = new Set();
const setStatus = t => { document.getElementById("status").textContent = t; };

// every change goes to the same document/field the phone uses
WRITE = (file, key, value) => {
  if (value === null || value === undefined) delete DATA[file][key]; else DATA[file][key] = value;
  if (!uid) return;
  setDoc(doc(db, "users", uid, "prefs", file), { [key]: value == null ? deleteField() : value }, { merge: true })
    .catch(e => setStatus("Sync error: " + e.message));
};

document.getElementById("signin").onclick = () =>
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { document.getElementById("loginerr").textContent = e.message; });
document.getElementById("signout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set();
  uid = user ? user.uid : null;
  window.SIGNED_IN = !!user;
  document.getElementById("login").hidden = !!user;
  document.getElementById("app").hidden = !user;
  if (!user) return;
  document.getElementById("who").textContent = user.email || "";
  window.USER_NAME = (user.displayName || "").trim().split(" ")[0] || "";
  for (const f of FILES) {
    unsubs.push(onSnapshot(doc(db, "users", uid, "prefs", f), { includeMetadataChanges: true }, snap => {
      if (snap.metadata.hasPendingWrites) return;
      DATA[f] = snap.data() || {};
      if (!snap.metadata.fromCache) loaded.add(f);
      if (loaded.size === FILES.length && !window.SEEDED) {
        window.SEEDED = true;
        if (!DATA.quit_timer.start_date) WRITE("quit_timer", "start_date", ymd(new Date()));
        seedTasksIfNeeded(); seedBudgetIfNeeded();
        setTimeout(checkInDialog, 800);
      }
      setStatus(snap.metadata.fromCache ? "Offline · will sync later" : "Synced ✓");
      const a = document.activeElement;
      if (!document.querySelector("dialog") && !(a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName))) render();
    }, e => setStatus("Sync error: " + e.message)));
  }
  render();
});
</script>
