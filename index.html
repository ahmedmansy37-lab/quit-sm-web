<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quit Timer</title>
<meta name="theme-color" content="#14202B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%2314202B'/%3E%3Ccircle cx='54' cy='54' r='28' fill='none' stroke='%234FD1A5' stroke-width='5'/%3E%3Crect x='36' y='50' width='28' height='8' fill='%23F2F2F2'/%3E%3Crect x='64' y='50' width='8' height='8' fill='%23E8A24A'/%3E%3Crect x='33' y='50' width='3' height='8' fill='%23FF6B5B'/%3E%3C/svg%3E">
<style>
:root{--bg:#12171D;--card:#1B222A;--line:#2A333D;--line2:#2A333D;--text:#EFF3F6;--muted:#8A99A8;--accent:#4FD1A5;--warn:#FF6B5B;--amber:#E8A24A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101a23;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px}
header .logo{font-weight:700;font-size:18px;margin-right:8px}
#nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.nav.on,.nav:hover{background:var(--card);color:var(--text)}
#acct{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
h1{margin:0;font-size:28px} h3{margin:0 0 10px;font-size:17px}
.head{margin:6px 0 14px}.head.row{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px} .warn{color:var(--warn)!important} .ok{color:var(--accent)!important} .amber{color:var(--amber)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.center{text-align:center}
.big{width:240px;height:240px;border-radius:50%;border:6px solid var(--accent);background:#173A30;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px auto 10px;cursor:pointer;font:inherit;transition:transform .1s}
.big:active{transform:scale(.97)} .big b{font-size:30px} .big.locked{border-color:var(--warn);background:#2A1F25;cursor:not-allowed} .big.locked b{font-size:44px}
.big small{color:var(--muted)}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:#26303A;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
.btn{background:var(--accent);color:#06231A;border:0;border-radius:22px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.outline{background:none;color:var(--text);border:1px solid var(--muted)} .btn.wide{width:100%;margin:6px 0;padding:14px}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:6px 8px;border-radius:8px}.link:hover{background:#ffffff10}
.line{display:flex;align-items:center;gap:8px;padding:4px 0}.line>span{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.spend{margin-top:12px;background:#14202B;border-radius:14px;padding:14px;cursor:pointer}.spend b{display:block;font-size:24px}
input,select{background:#14202B;color:var(--text);border:1px solid #ffffff30;border-radius:10px;padding:9px 10px;font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.form>*{margin-bottom:8px}.form input#f_title{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{color:var(--muted);font-size:13px}
.days{display:flex;gap:6px}.day{width:34px;height:34px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--text);cursor:pointer;font:inherit}.day.on{background:var(--accent);border-color:var(--accent);color:#06231A}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.daynav div{flex:1;text-align:center}.daynav b{display:block}.daynav .link{font-size:18px}
.hours{border-top:1px solid var(--line)}
.hour{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.hour>span{width:60px;color:var(--muted);font-size:12px;padding-top:8px;flex:none}.hour>div{flex:1;display:flex;flex-direction:column;gap:6px}
.hour.now>span{color:var(--accent);font-weight:700}.hour.now .slot{border-color:var(--accent)}
.slot{height:40px;border:1px dashed #ffffff25;border-radius:10px;background:none;color:#ffffff55;text-align:left;padding:0 12px;cursor:pointer;font-size:16px}.slot:hover{background:#ffffff08;color:var(--text)}
.task{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;border-left:6px solid;padding:6px 8px 6px 12px}
.task .tmain{flex:1;cursor:pointer}.task small{display:block;color:var(--muted);font-size:12px}.task b{font-size:15px}
.task.late{background:#3A1F24}.task.late b,.task.late small{color:var(--warn)}.task.done b{text-decoration:line-through;color:var(--muted)}
.prayer{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:2px solid transparent;border-radius:14px;padding:16px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer;text-align:left}
.prayer b{display:block;font-size:18px}.prayer small{color:var(--muted)}.prayer i{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.prayer.done{background:#173A30}.prayer.done b{text-decoration:line-through}.prayer.done i{background:var(--accent);border-color:var(--accent);color:#06231A}
.prayer.late{background:#3A1F24}.prayer.late b,.prayer.late small{color:var(--warn)}.prayer.next{border-color:var(--accent)}
.bar{height:14px;border-radius:7px;background:#ffffff18;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:7px}.bar.big{height:12px;margin:6px 0}
.barrow{display:flex;align-items:center;gap:10px;margin:5px 0}.barrow span{width:110px;font-size:13px}.barrow em{font-style:normal;font-size:12px;min-width:90px;text-align:right}
.huge{font-size:26px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px}.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.cols i{width:70%;border-radius:5px 5px 0 0;display:block}.cols small{color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--muted);font-weight:500;text-align:left}td,th{padding:7px 6px;border-bottom:1px solid var(--line)}
.chart{width:100%;height:160px;display:block}
dialog{background:var(--card);color:var(--text);border:0;border-radius:18px;padding:0;max-width:520px;width:92%}dialog::backdrop{background:#000a}
.dlg{padding:20px;display:flex;flex-direction:column;gap:8px}.dlg input#e_title,.dlg input#f_title{width:100%}
#login{max-width:460px;margin:12vh auto;text-align:center}#login .card{padding:30px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#222;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
#status{font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;border:0;font-family:inherit}
.warnpill{background:#3A1F24;color:#FF9A8E;cursor:pointer;padding:6px 12px;font-size:13px}
.week{display:flex;gap:4px;padding:6px}.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);border-radius:10px;padding:5px 0;cursor:pointer;font:inherit;font-size:11px}
.wd b{color:var(--text);font-size:15px}.wd i{width:6px;height:6px;border-radius:50%}.wd.on{background:#E8EDF2;color:#12171D}.wd.on b{color:#12171D}
.cool{display:flex;align-items:center;gap:16px}.ringbtn{position:relative;width:130px;height:130px;border:0;background:none;padding:0;cursor:pointer;color:var(--text);flex:none}
.ringbtn:disabled{cursor:not-allowed}.ringbtn svg{position:absolute;inset:0}.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:22px}.rc small{color:var(--muted)}
.qa{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.qbtn{flex:1;background:#26303A;color:var(--text);border:1px solid #34404C;border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.qbtn.active{background:#173A30;color:var(--accent);border-color:var(--accent)}
.rings{display:flex;justify-content:space-between}.ring{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:6px}.tl{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,#1B222A);border-radius:8px;padding:6px 10px;cursor:pointer}
.tl b{display:block}.tl small{color:var(--muted)}.tl.late{background:#3A1F24}.tl.late b{color:var(--warn)}.tl.done b{text-decoration:line-through;color:var(--muted)}
.prayer-tl{border:1px dashed var(--accent);border-radius:8px;padding:5px 10px;color:#7FE3C0;font-size:13px}.prayer-tl.done{opacity:.5}
.nowline{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:11px}.nowline i{flex:1;height:2px;background:var(--warn);position:relative}.nowline i:before{content:'';position:absolute;left:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.slot.free{height:auto;padding:6px 12px;font-size:12px;text-align:center}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden}.stack i{display:block;height:100%}
.tip{background:#1A2A3A;border-color:#2C4A6B;color:#9CC1FF}.clickable{cursor:pointer;border-radius:8px}.clickable:hover{background:#ffffff08}
.task{position:relative}.task[draggable]{cursor:grab}.grip{position:absolute;left:30%;right:30%;bottom:0;height:7px;cursor:ns-resize;border-bottom:3px solid #ffffff30;border-radius:0 0 6px 6px}.grip:hover{border-color:var(--accent)}
.resizetag{position:absolute;right:8px;bottom:-22px;background:var(--accent);color:#06231A;font-size:12px;padding:2px 8px;border-radius:8px;z-index:5}
.dragging{opacity:.4}.dropover{outline:2px dashed var(--accent);outline-offset:2px;border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{background:none;border:0;color:var(--muted);padding:7px 14px;cursor:pointer;font:inherit}.seg button.on{background:var(--line);color:var(--text)}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.wcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:6px}.wcol.today{border-color:var(--accent)}
.wh{cursor:pointer;padding:2px 4px 6px;border-bottom:1px solid var(--line)}.wtask{background:#ffffff08;border-left:4px solid;border-radius:8px;padding:4px 6px;cursor:grab;font-size:13px}.wtask small{display:block;color:var(--muted);font-size:11px}.wtask.late{background:#3A1F24}.wtask.done b{text-decoration:line-through;color:var(--muted)}
.slot.paste{border-color:var(--amber);color:var(--amber);font-size:13px;margin-left:6px}.clip{border-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#06231A;padding:10px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:99}.toast.show{transform:translateX(-50%) translateY(0)}
.qbtn.crave{width:100%;margin:8px 0 0;border-color:var(--amber);color:var(--amber)}
.cols.hrs{height:70px;gap:2px}.cols.hrs small{font-size:9px}
textarea{width:100%;box-sizing:border-box;background:#0E1318;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.scrollx{overflow-x:auto}table.plan input,table.plan select{padding:4px 6px;font-size:13px;max-width:130px}table.plan tr.off{opacity:.45}table.plan .day{width:24px;height:24px;font-size:11px}
.goal .huge small{font-size:13px;font-weight:400}
.hour>span small{display:block;font-size:11px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{color:var(--muted);font-size:11px;text-align:center}
.cd{position:relative;background:#ffffff06;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:4px 2px;min-height:44px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.cd::before{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--h) * 100%);background:#E8A24A22}.cd b,.cd small{position:relative}.cd small{font-size:10px;color:var(--amber)}
.cd.today{border-color:var(--accent)}.cd.sel{background:var(--accent);color:#06231A}.cd.sel small{color:#06231A}.cd.future{opacity:.45}
table.stmt{width:100%;border-collapse:collapse;font-size:13px}table.stmt th,table.stmt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}table.stmt th{color:var(--muted);font-weight:500}
table.stmt .num{text-align:right;white-space:nowrap}table.stmt tr.tot td{font-weight:700;border-top:2px solid var(--line)}table.stmt tr.clickable{cursor:pointer}table.stmt tr.clickable:hover{background:#ffffff08}
.scrolly{max-height:55vh;overflow:auto;margin:8px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}.row.wrap{flex-wrap:wrap}
/* ===== Stage 4: icons + motion (same durations as the phone) ===== */
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none;display:inline-block}
.btn .ic,.qbtn .ic{margin-right:2px}
.btn,.qbtn,.link,.prayer,.nav,.wd,.cd,.gbtn,.pill,.ringbtn{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s}
.btn:active,.qbtn:active,.link:active,.prayer:active,.nav:active,.wd:active,.cd:active,.gbtn:active,.pill:active{transform:scale(.96)}
.ck path{stroke-dasharray:1;stroke-dashoffset:0}
.justdone .ck path{animation:qt-draw .33s ease-out both}
.justdone{animation:qt-pop .3s ease-out}
@keyframes qt-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes qt-pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.pulse{display:inline-block;color:#F472B6;animation:qt-pulse 1.2s ease-in-out infinite;transform-origin:50% 55%}
@keyframes qt-pulse{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.12)}56%{transform:scale(1)}}
.shake{animation:qt-shake .33s ease-in-out 2}
@keyframes qt-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.enter .card{animation:qt-rise .3s ease-out both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes qt-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:qt-fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes qt-fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.2}}
.spin{animation:qt-spin 1s linear infinite}
@keyframes qt-spin{to{transform:rotate(360deg)}}
#status .ic{margin-right:4px}
.bpart{padding:2px 4px;margin:0 -4px}.bpart .barrow{margin:3px 0}.bpart .barrow span{width:138px;white-space:nowrap}.bpart .sub{display:block;margin:-2px 0 4px 148px;font-size:11px}
.barrow span .ic{color:var(--muted)}
.prayer.compact{padding:11px 14px;margin-bottom:8px}.prayer.compact b{font-size:16px}
.pcur .huge{font-size:30px}.done-card{border-color:#2E6B57}
details.ins>summary{cursor:pointer;list-style:none;padding:2px 0}details.ins>summary::-webkit-details-marker{display:none}
details.ins>summary::before{content:'▸ ';color:var(--muted)}details.ins[open]>summary::before{content:'▾ '}
details.ins[open]{background:none;border-color:transparent;padding:0}details.ins[open]>summary{padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>Quit Timer</h1>
    <p class="muted">Sign in with the same Google account you use on the phone.</p>
    <button class="gbtn" id="signin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
    <p id="loginerr" class="warn small"></p>
  </div>
</div>
<div id="app" hidden>
  <header><span class="logo">Quit Timer</span><nav id="nav"></nav><div id="acct"><span id="status" class="muted">Connecting…</span><span id="who"></span><button class="link" id="signout">Sign out</button></div></header>
  <main id="main"></main>
</div>
<script>
// ===================== Quit Timer — shared logic (same data as the Android app) =====================
// Data lives in 3 documents, exactly like the phone's local storage files:
//   quit_timer        (cigarettes, coffee, exercise, heart caches)
//   quit_timer_tasks  (tasks, prayers, repeats)
//   quit_timer_budget (expenses, income, rent)

const DATA = { quit_timer: {}, quit_timer_tasks: {}, quit_timer_budget: {} };
let WRITE = (file, key, value) => { DATA[file][key] = value; }; // replaced by the Firestore writer

const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayOf = ms => ymd(new Date(ms));
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYm = s => { const [y, m] = s.split('-').map(Number); return new Date(y, m - 1, 1); };
const addMonths = (s, n) => { const d = parseYm(s); return ymOf(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthLen = s => { const d = parseYm(s); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const atMinute = (dayStr, minute) => { const d = parseYmd(dayStr); d.setMinutes(minute); return d.getTime(); };
const minuteOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtMin = m => fmtTime(new Date(2000, 0, 1, Math.floor(m / 60) % 24, m % 60).getTime());
const money = v => Math.round(v).toLocaleString('en-US') + ' EGP';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const dow = dayStr => { const g = parseYmd(dayStr).getDay(); return g === 0 ? 7 : g; }; // Mon=1..Sun=7
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const jsonOr = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

// ---------------- cigarettes / coffee / exercise ----------------
const Q = () => DATA.quit_timer;
const EVT = { SMOKE: { key: 'cigarettes', label: 'Cigarette', before: 20, after: 30 }, COFFEE: { key: 'coffee', label: 'Coffee', before: 20, after: 60 } };
function events(type) { const l = (Q()[EVT[type].key] || '').split(',').filter(Boolean).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b); if (type === 'SMOKE') l._smoke = true; return l; }
// forgotten cigarettes: +1 to a day's count, stored without a time {"YYYY-MM-DD": n}
let _xc = { raw: null, val: {} };
function extraCigs() { const r = Q().extra_cigs || ''; if (r !== _xc.raw) _xc = { raw: r, val: jsonOr(r, {}) }; return _xc.val; }
function extraOn(day) { return +(extraCigs()[day] || 0); }

// ---------------- prayer times (Cairo, Egyptian General Authority) ----------------
const Prayer = (() => {
  const LAT = 30.0444, LNG = 31.2357;
  const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
  const ds = x => Math.sin(rad(x)), dc = x => Math.cos(rad(x)), dt = x => Math.tan(rad(x));
  const fa = a => a - 360 * Math.floor(a / 360), fh = a => a - 24 * Math.floor(a / 24);
  function julian(y, m, d) { if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  function sun(jd) {
    const D = jd - 2451545.0, g = fa(357.529 + 0.98560028 * D), q = fa(280.459 + 0.98564736 * D);
    const L = fa(q + 1.915 * ds(g) + 0.020 * ds(2 * g)), e = 23.439 - 0.00000036 * D;
    const RA = deg(Math.atan2(dc(e) * ds(L), dc(L))) / 15;
    return { decl: deg(Math.asin(ds(e) * ds(L))), eqt: q / 15 - fh(RA) };
  }
  return {
    NAMES: ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
    forDate(dayStr) {
      const d = parseYmd(dayStr);
      const tz = -new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTimezoneOffset() / 60;
      const jd = julian(d.getFullYear(), d.getMonth() + 1, d.getDate()) - LNG / (15 * 24);
      const mid = t => fh(12 - sun(jd + t).eqt);
      const sat = (a, t, ccw) => { const de = sun(jd + t).decl, n = mid(t); const v = (-ds(a) - ds(de) * ds(LAT)) / (dc(de) * dc(LAT)); const tt = deg(Math.acos(Math.max(-1, Math.min(1, v)))) / 15; return ccw ? n - tt : n + tt; };
      const asr = t => { const de = sun(jd + t).decl; return sat(-deg(Math.atan(1 / (1 + dt(Math.abs(LAT - de))))), t, false); };
      const adj = tz - LNG / 15;
      return [sat(19.5, 5 / 24, true), mid(12 / 24) + 1 / 60, asr(13 / 24), sat(0.833, 18 / 24, false) + 2 / 60, sat(17.5, 18 / 24, false)]
        .map(x => ((Math.round((x + adj) * 60) % 1440) + 1440) % 1440);
    }
  };
})();

function checkIns(now = Date.now()) {
  const occs = occurrencesOn(ymd(new Date())), out = [];

    const askAt = o.dur > 0 ? o.start + o.dur * 60000 : o.start + 3600000;
    if (now >= askAt) out.push({ o, q: `Did you finish ${o.title}?`, prayer: false });
  }
  const salah = occs.filter(o => o.isSalah).sort((a, b) => a.start - b.start);
  salah.forEach((p, i) => {
    if (p.done || p.start > now) return;
    // ask only in the last 15 min before the next prayer; Isha: 11:45 PM – midnight
    const next = salah[i + 1];
    const end = next ? next.start : atMinute(ymd(new Date(now)), 24 * 60);

// ===================== Stage 2 — goals, balance score, urges, patterns =====================
const TARGETS = { STUDY: 600, READING: 180, GYM_DAYS: 4, SAVINGS: 10000 }; // minutes per week / days per week / EGP per month

// ---- urges (craving button) ----
function urges() { return jsonOr(Q().urges, []); }

// ---- postpone counter (for "most postponed") ----
function postponeCounts() { return jsonOr(TK().postpones, {}); }
function countPostpone(title) { const p = postponeCounts(), k = title.trim().toLowerCase(); p[k] = (p[k] || 0) + 1; WRITE('quit_timer_tasks', 'postpones', JSON.stringify(p)); }

// ---- helpers ----
const daysBack = n => { const out = []; for (let i = n - 1; i >= 0; i--) out.push(ymd(addDays(new Date(), -i))); return out; };

function avgGapOn(cigs, day) { const l = cigs.filter(t => dayOf(t) === day); if (l.length < 2) return null; let s = 0; for (let i = 1; i < l.length; i++) s += l[i] - l[i - 1]; return s / (l.length - 1) / 60000; }

function compare(days, pred, fn) { // avg of fn over days where pred is true vs false

const STEPS_TARGET = 8000;
function stepsOn(day) { return +(jsonOr(Q().steps_cache, {})[day] || 0); }
function smokeScore(cigs, start, day) {
  const W0 = 9 * 60, WIN = 14 * 60, now = Date.now(), isToday = day === ymd(new Date());

// ---- daily balance score ----
function balanceScore(day = ymd(new Date())) {

  const parts = [];

  else if (!cigs.some(c => dayOf(c) < day)) parts.push({ k: 'smoke', name: 'Smoking', got: BALANCE_W.smoke, max: BALANCE_W.smoke, hint: `${countOn(cigs, day)} today` });

  const pf = sal.length ? sal.filter(o => o.done).length / sal.length : 1, tf = tk.length ? tk.filter(o => o.done).length / tk.length : 1;
  parts.push({ k: 'tasks', name: 'Tasks & prayers', got: Math.round(BALANCE_W.tasks * (pf + tf) / 2), max: BALANCE_W.tasks, hint: `${sal.filter(o => o.done).length}/5 prayers · ${tk.filter(o => o.done).length}/${tk.length} tasks` });
  const m = day.slice(0, 7), before = expensesIn(m).filter(e => dayOf(e.time) < day).reduce((s, e) => s + e.amount, 0) + (cigs.filter(t => dayOf(t).startsWith(m) && dayOf(t) < day).length + Object.entries(extraCigs()).filter(([d]) => d.startsWith(m) && d < day).reduce((s, [, n]) => s + (+n || 0), 0)) * CFG.PER_CIG;

// ---- goal 1: smoking ----
function smokingGoal() {

  const past = d => d >= start && d < today;

  const per = l => avg(l.map(d => countOn(cigs, d)));

// ---- goal 2: heart ----
function heartGoal() {

    const s = addDays(mon, -7 * w), vals = [0, 1, 2, 3, 4, 5, 6].map(i => (heart[ymd(addDays(s, i))] || {}).rest).filter(v => v != null);

// ---- goal 3: time ----

}

// ---- goal 4: gym ----
function gymGoal() {

// ---- cross-goal links ----
function crossLinks() {
  const cigs = events('SMOKE'), start = startDate(), today = ymd(new Date());

    exercise: { cigs: compare(days, exDay, c), gap: compare(days, exDay, d => avgGapOn(cigs, d)), done: compare(days, exDay, completionOn) },

// ---- gentle trends ----
function trends() {
  const cigs = events('SMOKE'), start = startDate(), today = ymd(new Date());

  const a = l => avg(l.map(d => countOn(cigs, d)));

// ---- personal tip using the user's own numbers ----
function personalTip() {
  const x = crossLinks(), s = smokingGoal(), today = ymd(new Date());

    return `On exercise days your gap between cigarettes is about ${Math.round(x.exercise.gap.yes - x.exercise.gap.no)} min longer. A light workout today could help.`;

    return `You smoke about ${r1(x.exercise.cigs.no - x.exercise.cigs.yes)} fewer cigarettes on exercise days. Even a 20-minute walk counts.`;

  if (x.exercise.cigs.yes != null && x.exercise.cigs.no != null) lines.push(`Exercise days: ${r1(x.exercise.cigs.yes)} cigarettes vs ${r1(x.exercise.cigs.no)} on other days.`);

  if (s.a7 != null) lines.push(`Average cigarettes per day, last 7 days: ${r1(s.a7)}. Today's required gap: ${gapMinutes(startDate(), ymd(new Date()))} min.`);

const fromHHMM = s => { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; };
function fmtRemaining(ms) { const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
const dayTitle = d => { const t = ymd(new Date()); if (d === t) return 'Today'; if (d === ymd(addDays(new Date(), 1))) return 'Tomorrow'; if (d === ymd(addDays(new Date(), -1))) return 'Yesterday'; return parseYmd(d).toLocaleDateString('en-US', { weekday: 'long' }); };
const longDate = d => parseYmd(d).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
const monthName = m => parseYm(m).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

// ---------------- rendering ----------------
function render() {
  if (!window.SIGNED_IN) return;
  rollover();
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="nav ${UI.tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${l}</button>`).join('');
  const views = { today: vToday, tasks: vTasks, prayers: vPrayers, budget: vBudget, history: vHistory, insights: vInsights };
  $('#main').innerHTML = (views[UI.tab] || vToday)();
  tick();
}
const card = (title, body, extra = '') => `<section class="card ${extra}">${title ? `<h3>${title}</h3>` : ''}${body}</section>`;
const stat = (label, value, cls = '') => `<div class="stat ${cls}"><b>${value}</b><span>${label}</span></div>`;
const bar = (label, v, max, color, text) => `<div class="barrow"><span>${esc(label)}</span><div class="bar"><i style="width:${Math.max(2, Math.min(100, v / max * 100))}%;background:${color}"></i></div><em>${text}</em></div>`;

function catOptions(sel) { return Object.entries(CATS).filter(([k]) => k !== 'PRAYER').map(([k, c]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${c.label}</option>`).join(''); }
function daysPicker(days, attr) { return `<div class="days">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((l, i) => `<button type="button" class="day ${days.includes(i + 1) ? 'on' : ''}" data-act="${attr}" data-arg="${i + 1}">${l}</button>`).join('')}</div>`; }

function taskForm() {
  const f = UI.form;
  if (!f.start) f.start = toHHMM(nextHalfHour());
  return `<div class="form">
    <input id="f_title" placeholder="Task" value="${esc(f.title)}" data-bind="form.title">
    <div class="row">
      <select data-bind="form.cat">${catOptions(f.cat)}</select>
      ${f.days.length ? '' : `<input type="date" value="${f.date}" data-bind="form.date">`}
      <label>from <input type="time" value="${f.start}" data-bind="form.start"></label>
      <label>to <input type="time" value="${f.end}" data-bind="form.end"></label>
    </div>
    <div class="row"><span class="muted">Repeat</span>${daysPicker(f.days, 'formday')}</div>
    <button class="btn" data-act="addtask">Add to schedule</button>
  </div>`;
}

const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`;
function ringSvg(frac, color, size, stroke, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="${stroke}"/>` +
    `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` +
    (label ? `<text x="50%" y="54%" text-anchor="middle" font-size="${size > 80 ? 15 : 11}" fill="var(--text)">${label}</text>` : '') + `</svg>`;
}
const ringStat = (frac, val, label, color) => `<div class="ring">${ringSvg(frac, color, 52, 6, val)}<span>${label}</span></div>`;
function weekStrip(cigs, start) {
  const t = new Date(), mon = addDays(t, -((t.getDay() + 6) % 7)), today = ymd(t);
  return `<div class="card week">${[0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = ymd(addDays(mon, i)); let dot = '';
    if (d < today && d > start) { const a = countOn(cigs, d), b = countOn(cigs, ymd(addDays(parseYmd(d), -1))); dot = a < b ? 'var(--accent)' : a === b ? 'var(--amber)' : 'var(--warn)'; }
    return `<button class="wd ${d === today ? 'on' : ''}" data-act="openday" data-arg="${d}"><span>${parseYmd(d).toLocaleDateString('en-US', { weekday: 'short' })}</span><b>${parseYmd(d).getDate()}</b><i style="background:${dot || 'transparent'}"></i></button>`;
  }).join('')}</div>`;
}
function expenseForm(prefix) {

  return `<div class="row"><input type="number" min="0" step="1" placeholder="Amount (EGP)" value="${esc(e.amount)}" data-bind="${prefix}.amount" style="width:130px">
    <select data-bind="${prefix}.cat" data-rerender="1">${MANUAL_CATS.map(c => `<option value="${c}" ${c === e.cat ? 'selected' : ''}>${EXP_CATS[c][0]}</option>`).join('')}</select>
    ${e.cat === 'BILLS' ? `<select data-bind="${prefix}.sub">${BILL_TYPES.map(b => `<option ${b === e.sub ? 'selected' : ''}>${b}</option>`).join('')}</select>` : ''}
    <select data-bind="${prefix}.method">${PICK_METHODS.map(k => `<option value="${k}" ${k === e.method ? 'selected' : ''}>${METHODS[k]}</option>`).join('')}</select>
    <input placeholder="Note (optional)" value="${esc(e.note)}" data-bind="${prefix}.note" style="flex:1;min-width:120px">
    <button class="btn" data-act="addexp" data-arg="${prefix}">Add</button></div>`;
}
function dayTimeline(now) {
  const today = ymd(new Date()), occs = occurrencesOn(today);
  const items = occs.filter(o => !o.isWird);
  if (!items.length) return '<p class="muted">Nothing planned yet. Click + Add.</p>';
  let h = '', placedNow = false, prevEnd = null;
  for (const o of items) {
    if (!placedNow && o.start > now) { h += nowLine(now); placedNow = true; }
    if (prevEnd && o.start - prevEnd >= 3600000) h += `<button class="slot free" data-act="addat" data-arg="${new Date(prevEnd).getHours()}">free ${fmtDur(Math.round((o.start - prevEnd) / 60000))} · click to add</button>`;
    if (o.isPrayer) h += `<div class="tl prayer-tl ${o.done ? 'done' : ''}"><small>${fmtTime(o.start)}</small> ${esc(o.title)}</div>`;
    else h += `<div class="tl ${isLate(o, now) ? 'late' : ''} ${o.done ? 'done' : ''}" style="--c:${CATS[o.cat].color};min-height:${o.dur ? 30 + Math.min(120, o.dur) / 2 : 30}px" data-act="edit" data-arg="${o.key}"><b>${esc(o.title)}</b><small>${CATS[o.cat].label} · ${fmtTime(o.start)}${o.dur ? '–' + fmtTime(o.start + o.dur * 60000) : ''}</small></div>`;
    prevEnd = Math.max(prevEnd || 0, o.start + Math.max(o.dur, 15) * 60000);
  }
  if (!placedNow) h += nowLine(now);
  return h;
}
const nowLine = now => `<div class="nowline"><i></i><span>${fmtTime(now)}</span></div>`;

  const now = Date.now(), today = ymd(new Date()), start = startDate();
  const cigs = events('SMOKE'), coffees = events('COFFEE'), ex = exerciseDays();

    `<p class="muted small" style="margin:10px 0 4px">By category</p><div class="stack">${Object.entries(bc).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<i style="width:${v / bcTotal * 100}%;background:${CATS[c].color}" title="${CATS[c].label} ${fmtDur(v)}"></i>`).join('')}</div>

  if (tip) h += `<section class="card tip">💡 ${esc(tip)}</section>`;
  h += `</div></div>`;
  return h;
}

function taskRow(o, now) {
  const late = isLate(o, now);
  const t = fmtTime(o.start) + (o.dur ? ' – ' + fmtTime(o.start + o.dur * 60000) : '');
  return `<div class="task ${late ? 'late' : ''} ${o.done ? 'done' : ''}" style="border-left-color:${CATS[o.cat].color};min-height:${o.dur ? Math.max(54, Math.round(o.dur / 60 * 56) - 10) : 54}px">
    <div class="tmain" data-act="edit" data-arg="${o.key}"><small>${t}${o.overdue && !o.done ? ' · overdue' : ''}${o.recId ? ' · repeats' : ''}</small><b>${esc(o.title)}</b></div>
    ${o.done ? `<button class="link ok" data-act="undone" data-arg="${o.key}">✓ Done</button>` : `<button class="link ok" data-act="done" data-arg="${o.key}">Done</button><button class="link amber" data-act="postpone" data-arg="${o.key}">Postpone</button>`}
  </div>`;
}

function vTasks() {
  const now = Date.now(), d = UI.taskDay, occs = occurrencesOn(d).filter(o => !o.isPrayer);
  const curH = d === ymd(new Date()) ? new Date().getHours() : -1;
  const early = occs.filter(o => new Date(o.start).getHours() < 9);
  let rows = '';
  if (early.length) rows += `<div class="hour"><span>Early</span><div>${early.map(o => taskRow(o, now)).join('')}</div></div>`;
  // a task stretching over several hours is one block; the hour rows it covers are merged into it
  const endHour = o => o.dur ? Math.ceil((minuteOf(o.start) + o.dur) / 60) : new Date(o.start).getHours() + 1;
  let h = 9;
  while (h <= 23) {
    const items = occs.filter(o => new Date(o.start).getHours() === h);
    let to = h + 1;
    if (items.length) {
      to = Math.max(to, ...items.map(endHour));
      // keep extending while covered hours have no tasks of their own that start there… they merge too
      for (let k = h + 1; k < to && k <= 23; k++) { const own = occs.filter(o => new Date(o.start).getHours() === k); if (own.length) { own.forEach(o => items.push(o)); to = Math.max(to, ...own.map(endHour)); } }
    }
    to = Math.min(to, 24);
    const hasNow = curH >= h && curH < to;
    let inner;
    if (hasNow) {
      const past = items.filter(o => o.start <= now), fut = items.filter(o => o.start > now);
      inner = past.map(o => taskRow(o, now)).join('') + nowLine(now) + fut.map(o => taskRow(o, now)).join('') + (items.length ? '' : `<button class="slot" data-act="addat" data-arg="${h}">+</button>`);
    } else inner = items.length ? items.map(o => taskRow(o, now)).join('') : `<button class="slot" data-act="addat" data-arg="${h}">+</button>`;
    const label = fmtMin(h * 60).replace(':00', '') + (to - h > 1 ? `<small>– ${fmtMin((to % 24) * 60).replace(':00', '')}</small>` : '');
    rows += `<div class="hour ${hasNow ? 'now' : ''}" data-drop="${h}"><span>${label}</span><div>${inner}</div></div>`;
    h = to;
  }
  return `<div class="head row"><h1>Tasks</h1><button class="btn" data-act="addat" data-arg="-1">+ Add</button></div>
    ${dayNav(d, 'taskday')}
    ${UI.undo && UI.undo.kind === 'TASK' && UI.undo.until > now ? `<div class="card line"><span>Marked done</span><button class="link amber" data-act="undo">Undo</button></div>` : ''}
    <div class="hours">${rows}</div>`;
}
function dayNav(d, act) {

function vBudget() {
  const m = UI.month, cur = ymOf(new Date()), cigs = events('SMOKE');
  const total = budgetFor(m), sp = spent(m, cigs), left = total - sp, low = total > 0 && left < total * CFG.WARN;

  }).join('');

  const maxC = Math.max(...Object.values(bc), 0), maxM = Math.max(...Object.values(bm), 0);
  return `<div class="head"><h1>Budget</h1></div>
  <div class="daynav"><button class="link" data-act="month" data-arg="-1">◀</button><div><b>${monthName(m)}</b></div><button class="link" data-act="month" data-arg="1">▶</button></div>
  <div class="grid2">
  <div>
  ${card('This month', `<div class="stats">${stat('budget', money(total))}${stat('spent', money(sp))}${stat('left', money(left), low ? 'warn' : '')}</div>
    <div class="bar big"><i style="width:${total > 0 ? Math.max(1, Math.min(100, sp / total * 100)) : 0}%;background:${low ? 'var(--warn)' : 'var(--accent)'}"></i></div>

function svgLine(series, markers) {
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length) return '<p class="muted">No heart data yet. The phone reads it from Health Connect and syncs it here.</p>';
  const lo = Math.min(...all) - 3, hi = Math.max(...all) + 3, W = 600, H = 160, n = series[0].values.length, sx = W / Math.max(1, n - 1);
  const y = v => (H - 10) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (const s of series) {
    let p = '', on = false;
    s.values.forEach((v, i) => { if (v == null) { on = false; return; } p += (on ? 'L' : 'M') + (i * sx).toFixed(1) + ',' + y(v).toFixed(1); on = true; g += `<circle cx="${i * sx}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`; });
    g += `<path d="${p}" stroke="${s.color}" stroke-width="2.5" fill="none"/>`;
  }
  markers.forEach((m, i) => { if (m) g += `<circle cx="${i * sx}" cy="${H - 3}" r="3" fill="#6CA0FF"/>`; });
  return `<small class="muted">${Math.round(hi)} bpm</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart">${g}</svg><small class="muted">${Math.round(lo)} bpm</small>
  <p class="muted small">${series.map(s => `<i class="dot" style="background:${s.color}"></i> ${s.name}`).join(' &nbsp; ')} &nbsp; <i class="dot" style="background:#6CA0FF"></i> exercise day</p>`;
}
function svgDelta(list) {
  const data = list.filter(e => e.delta != null).sort((a, b) => a.time - b.time).slice(-30);
  if (!data.length) return '<p class="muted">No heart-rate data around these events yet.</p>';
  const mx = Math.max(5, ...data.map(e => Math.abs(e.delta))), W = 600, H = 140, mid = H / 2, sw = W / data.length;
  const g = data.map((e, i) => { const h = Math.max(2, mid * Math.abs(e.delta) / mx), c = e.delta >= 0 ? '#FF6B5B' : '#4FD1A5'; return `<rect x="${i * sw + sw * 0.2}" y="${e.delta >= 0 ? mid - h : mid}" width="${sw * 0.6}" height="${h}" rx="3" fill="${c}" opacity="${e.mixed ? 0.35 : 1}"><title>${new Date(e.time).toLocaleString()}: ${e.delta > 0 ? '+' : ''}${e.delta.toFixed(0)} bpm</title></rect>`; }).join('');
  return `<small class="muted">+${Math.round(mx)} bpm</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart"><line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="#ffffff55" stroke-width="2"/>${g}</svg><small class="muted">−${Math.round(mx)} bpm</small>`;
}
const sgn = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1);
function effectCard(title, sub, list) {

  return card(title, `<p class="muted small">${sub}</p>${svgDelta(list)}<div class="stats">${stat('avg change', sgn(s.avg))}${stat('clean only', sgn(s.cleanAvg))}${stat('peak rise', sgn(s.peak))}</div><p class="muted small">${s.n} events with data · ${s.cleanN} without another cigarette/coffee in the window</p>`);
}
function vInsights() {

function weightCard() {
  const w = weights(), keys = Object.keys(w).sort(), last = keys.length ? w[keys[keys.length - 1]] : null;

      <div class="bar big"><i style="width:${Math.max(1, Math.min(100, lost / (WEIGHT_START - WEIGHT_TARGET) * 100))}%;background:var(--accent)"></i></div>`;
    const first = keys[0], days = Math.round((parseYmd(keys[keys.length - 1]) - parseYmd(first)) / DAY);

const localDT = ms => { const d = new Date(ms); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

    if (u.kind === 'TASK') setTaskDone(u.value, false);
    UI.undo = null; render();
  },
  exercise: () => { const s = exerciseDays(), d = ymd(new Date()); s.has(d) ? s.delete(d) : s.add(d); saveExerciseDays(s); render(); },
  alert: a => { const [i, done] = a.split(':'); const al = budgetAlerts()[+i]; if (al) resolveAlert(al, done === '1'); render(); },
  done: k => { setTaskDone(k, true); UI.undo = { kind: 'TASK', value: k, until: Date.now() + 10000 }; render(); setTimeout(render, 10100); },
  undone: k => { setTaskDone(k, false); render(); },

  edit: k => editDialog(k),
  addat: h => { UI.tab = 'tasks'; const f = UI.form; f.title = ''; f.date = UI.taskDay; f.start = toHHMM(+h >= 0 ? +h * 60 : nextHalfHour()); f.end = ''; f.days = []; quickAddDialog(); },
  formday: n => { n = +n; const f = UI.form; f.days = f.days.includes(n) ? f.days.filter(x => x !== n) : [...f.days, n]; render(); },
  addtask: () => {

  },

  prayerday: n => { UI.prayerDay = +n === 0 ? ymd(new Date()) : ymd(addDays(parseYmd(UI.prayerDay), +n)); render(); },
  month: n => { UI.month = addMonths(UI.month, +n); render(); },
  addexp: prefix => {

function freeSlots(day) {
  const occs = occurrencesOn(day).filter(o => !o.isWird), busy = occs.map(o => [o.start, o.start + Math.max(o.dur || 0, o.isPrayer ? 15 : 30) * 60000]).sort((a, b) => a[0] - b[0]);
  let cur = Math.max(atMinute(day, 9 * 60), day === ymd(new Date()) ? Math.ceil(Date.now() / 1800000) * 1800000 : 0); const end = atMinute(day, 24 * 60 - 1), out = [];
  for (const [s, e] of busy) { if (s - cur >= 30 * 60000) out.push([cur, s]); cur = Math.max(cur, e); }
  if (end - cur >= 30 * 60000) out.push([cur, end]);
  return out;
}

const CAT_BY_LABEL = { work: 'WORK', personal: 'PERSONAL', study: 'STUDY', reading: 'READING', gym: 'GYM', health: 'GYM' };
function parsePlan(text) {
  const blocks = [...String(text).matchAll(/```(?:json|quit-timer-plan)?\s*([\s\S]*?)```/gi)].map(m => m[1]);
  if (!blocks.length) { const i = text.indexOf('['), j = text.lastIndexOf(']'); if (i >= 0 && j > i) blocks.push(text.slice(i, j + 1)); }
  for (const b of blocks.reverse()) {
    let data; try { data = JSON.parse(b.trim()); } catch (e) { continue; }
    if (!Array.isArray(data)) data = data && (data.tasks || data.schedule);
    if (!Array.isArray(data)) continue;
    const out = data.map(t => {
      const cat = CAT_BY_LABEL[String(t.category || t.cat || 'Personal').toLowerCase()] || 'PERSONAL';
      const date = /^\d{4}-\d{2}-\d{2}$/.test(t.date || t.day || '') ? (t.date || t.day) : UI.taskDay;
      const st = /^\d{1,2}:\d{2}$/.test(t.startTime || t.start || '') ? (t.startTime || t.start).padStart(5, '0') : null;
      const en = /^\d{1,2}:\d{2}$/.test(t.endTime || t.end || '') ? (t.endTime || t.end).padStart(5, '0') : '';
      const rep = (Array.isArray(t.repeat) ? t.repeat : []).map(Number).filter(n => n >= 1 && n <= 7);
      return { include: true, title: String(t.title || '').trim(), cat, date, start: st, end: en, repeat: rep };
    }).filter(t => t.title && t.start);
    if (out.length) return out;
  }

}
function planWarnings(t) {
  const w = [], st = fromHHMM(t.start), en = fromHHMM(t.end), dur = en != null && en > st ? en - st : 0;
  const s = atMinute(t.date, st), e = s + Math.max(dur, 15) * 60000;
  for (const o of occurrencesOn(t.date)) {
    if (o.isWird) continue;
    if (o.title.trim().toLowerCase() === t.title.toLowerCase() && Math.abs(o.start - s) < 3600000) { w.push({ dup: true, text: 'Already scheduled' }); continue; }
    const oe = o.start + Math.max(o.dur || 0, 15) * 60000;
    if (s < oe && o.start < e) w.push({ dup: false, text: `Overlaps ${o.title} ${fmtTime(o.start)}` });

}

}

// ---------- calendar ----------
function calendarCard(m) {
  const cigs = events('SMOKE'), today = ymd(new Date());
  if (!UI.calDay || UI.calDay.slice(0, 7) !== m) UI.calDay = today.slice(0, 7) === m ? today : `${m}-01`;
  const first = parseYmd(`${m}-01`), lead = (first.getDay() + 6) % 7, len = monthLen(m);
  const totals = []; for (let i = 1; i <= len; i++) totals.push(dayTotal(cigs, `${m}-${pad(i)}`));
  const mx = Math.max(1, ...totals);
  let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<div class="cw">${w}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let i = 1; i <= len; i++) {
    const d = `${m}-${pad(i)}`, v = totals[i - 1];
    cells += `<button class="cd ${d === UI.calDay ? 'sel' : ''} ${d === today ? 'today' : ''} ${d > today ? 'future' : ''}" data-act="calday" data-arg="${d}" style="--h:${v / mx}"><b>${i}</b><small>${v ? Math.round(v) : ''}</small></button>`;
  }
  const d = UI.calDay, exps = dayExpenses(d), nC = countOn(cigs, d);
  const list = exps.map(e => `<div class="line clickable" data-act="editexp" data-arg="${e.id}"><i class="dot" style="background:${EXP_CATS[e.cat][1]}"></i><span>${EXP_CATS[e.cat][0]}${e.sub ? ' · ' + esc(e.sub) : ''} · ${METHODS[e.method] || e.method}<small class="muted"> ${fmtTime(e.time)}</small>${e.note ? `<br><small class="muted">${esc(e.note)}</small>` : ''}</span><b>${money(e.amount)}</b></div>`).join('')
    + (nC ? `<div class="line"><i class="dot" style="background:${EXP_CATS.CIGARETTES[1]}"></i><span>Cigarettes ×${nC}<small class="muted"> from the counter</small></span><b>${money(nC * CFG.PER_CIG)}</b></div>` : '');
  const inc = incomeRows(d, d);
  return card('Calendar', `<div class="cal">${cells}</div>
    <div class="line" style="margin-top:10px"><b>${d === today ? 'Today · ' : ''}${fmtD(d)}</b><b class="huge" style="font-size:20px">${money(dayTotal(cigs, d))}</b></div>
    ${list || '<p class="muted">No spending on this day.</p>'}
    ${inc.map(r => `<div class="line"><span>💵 ${esc(r.cat)} received</span><b class="ok">+${money(r.amount)}</b></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn" data-act="stmtdlg">📄 Account statement</button><button class="link" data-act="stmtday" data-arg="${d}">Statement for this day</button></div>`);
}

// ---------- statement ----------
function statementDialog(pre) {
  const t = ymd(new Date()), s = pre || UI.stmt || { from: `${t.slice(0, 7)}-01`, to: t, mode: 'exp', cats: Object.keys(EXP_CATS), single: false };
  dialog(`<h3>Account statement</h3>
    <div class="row"><label><input type="radio" name="per" value="day" ${s.single ? 'checked' : ''}> One day</label><label><input type="radio" name="per" value="range" ${s.single ? '' : 'checked'}> From – to</label></div>
    <div class="row"><label>From <input type="date" id="st_from" value="${s.from}"></label><label id="st_tol" ${s.single ? 'hidden' : ''}>To <input type="date" id="st_to" value="${s.to}"></label></div>
    <p class="muted small" style="margin:6px 0 2px">Show</p>
    <div class="row">${[['exp', 'Expenses only'], ['both', 'Expenses + income'], ['inc', 'Income only']].map(([k, l]) => `<label><input type="radio" name="mode" value="${k}" ${s.mode === k ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <p class="muted small" style="margin:6px 0 2px">Categories <button type="button" class="link" id="st_all">all</button> <button type="button" class="link" id="st_none">none</button></p>
    <div class="row wrap" id="st_cats">${Object.keys(EXP_CATS).map(c => `<label class="chip"><input type="checkbox" value="${c}" ${s.cats.includes(c) ? 'checked' : ''}> ${EXP_CATS[c][0]}</label>`).join('')}</div>
    <p id="st_err" class="warn small"></p>
    <div class="row"><button class="btn" value="show">Show statement</button><button class="link" value="">Cancel</button></div>`, d => {
    d.addEventListener('change', () => { const single = d.querySelector('input[name=per]:checked').value === 'day'; d.querySelector('#st_tol').hidden = single; });
    d.querySelector('#st_all').onclick = () => d.querySelectorAll('#st_cats input').forEach(i => i.checked = true);
    d.querySelector('#st_none').onclick = () => d.querySelectorAll('#st_cats input').forEach(i => i.checked = false);
    d.querySelector('form').addEventListener('submit', ev => {
      if (ev.submitter && ev.submitter.value !== 'show') return;
      const single = d.querySelector('input[name=per]:checked').value === 'day', from = d.querySelector('#st_from').value, to = single ? from : d.querySelector('#st_to').value;
      const mode = d.querySelector('input[name=mode]:checked').value, cats = [...d.querySelectorAll('#st_cats input:checked')].map(i => i.value);
      const err = !from || !to ? 'Pick the dates.' : to < from ? '"To" must be after "From".' : mode !== 'inc' && !cats.length ? 'Pick at least one category.' : '';
      if (err) { ev.preventDefault(); d.querySelector('#st_err').textContent = err; return; }
      UI.stmt = { from, to: to, mode, cats, single };
    });
    d.addEventListener('close', () => { if (d.returnValue === 'show') { render(); setTimeout(() => { const el = document.getElementById('stmt'); el && el.scrollIntoView && el.scrollIntoView({ behavior: 'smooth' }); }, 50); } });
  });
}
function statementTitle(s) {
  return `Account statement · ${s.from === s.to ? fmtD(s.from) : fmtD(s.from) + ' → ' + fmtD(s.to)} · ${{ exp: 'Expenses', both: 'Expenses + income', inc: 'Income' }[s.mode]}` +
    (s.mode !== 'inc' && s.cats.length < Object.keys(EXP_CATS).length ? ` · ${s.cats.map(c => EXP_CATS[c][0]).join(', ')}` : '');
}
function statementTable(r) {
  return `<table class="stmt"><tr><th>Date</th><th>Type</th><th>Category</th><th>Details</th><th>Method</th><th class="num">Amount</th></tr>
    ${r.rows.map(x => `<tr><td>${x.type === 'Income' || x.cat === 'Cigarettes' ? fmtD(x.date) : new Date(x.time).toLocaleString('en-US', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })}</td><td>${x.type}</td><td>${esc(x.cat)}</td><td>${esc(x.details)}</td><td>${esc(x.method)}</td><td class="num ${x.amount > 0 ? 'ok' : ''}">${x.amount > 0 ? '+' : '−'}${money(Math.abs(x.amount))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No transactions.</td></tr>'}
    <tr class="tot"><td colspan="5">Total expenses</td><td class="num">−${money(r.out)}</td></tr>
    ${r.inc || UI.stmt.mode !== 'exp' ? `<tr class="tot"><td colspan="5">Total income</td><td class="num ok">+${money(r.inc)}</td></tr><tr class="tot"><td colspan="5">Difference</td><td class="num ${r.net >= 0 ? 'ok' : 'warn'}">${r.net >= 0 ? '+' : '−'}${money(Math.abs(r.net))}</td></tr>` : ''}</table>`;
}
function statementCard() {
  const s = UI.stmt; if (!s) return '';
  const r = statementRows(s.from, s.to, s.mode, s.cats);
  return `<section class="card" id="stmt"><div class="line"><h3 style="margin:0">${esc(statementTitle(s))}</h3><span class="row"><button class="btn outline" data-act="stmtcsv">⬇ Download Excel</button><button class="btn outline" data-act="stmtprint">🖨 Print / PDF</button><button class="link" data-act="stmtdlg">Change</button><button class="link" data-act="stmtclose">✕</button></span></div>
    <p class="muted small">${r.rows.length} transactions</p><div class="scrollx">${statementTable(r)}</div></section>`;
}

const _vBudget = vBudget;
vBudget = function () {
  let h = _vBudget();
  h = h.replace('<div class="grid2">', statementCard() + '<div class="grid2">');
  h = h.replace(/(<section class="card ?"><h3>Add expense<\/h3>)/, calendarCard(UI.month) + '$1');
  return h;
};

Object.assign(ACTIONS, {
  catdetail: c => catDetailDialog(UI.month, c),
  calday: d => { UI.calDay = d; render(); },
  stmtdlg: () => statementDialog(),
  stmtday: d => { UI.stmt = { from: d, to: d, mode: 'both', cats: Object.keys(EXP_CATS), single: true }; render(); setTimeout(() => { const el = document.getElementById('stmt'); el && el.scrollIntoView && el.scrollIntoView({ behavior: 'smooth' }); }, 50); },
  stmtclose: () => { UI.stmt = null; render(); },
  stmtcsv: () => {
    const s = UI.stmt, r = statementRows(s.from, s.to, s.mode, s.cats), q = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [[statementTitle(s)], [], ['Date', 'Time', 'Type', 'Category', 'Details', 'Method', 'Amount (EGP)']]
      .concat(r.rows.map(x => [x.date, x.type === 'Income' || x.cat === 'Cigarettes' ? '' : fmtTime(x.time), x.type, x.cat, x.details, x.method, x.amount.toFixed(2)]))
      .concat([[], ['Total expenses', '', '', '', '', '', (-r.out).toFixed(2)], ['Total income', '', '', '', '', '', r.inc.toFixed(2)], ['Difference', '', '', '', '', '', r.net.toFixed(2)]]);
    const blob = new Blob(['﻿' + lines.map(l => l.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `statement-${s.from}${s.to !== s.from ? '_to_' + s.to : ''}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  stmtprint: () => {
    const s = UI.stmt, r = statementRows(s.from, s.to, s.mode, s.cats), w = window.open('', '_blank'); if (!w) { toast('Allow pop-ups to print'); return; }
    w.document.write(`<!DOCTYPE html><html><head><title>${esc(statementTitle(s))}</title><style>body{font-family:system-ui,sans-serif;margin:24px;color:#111}h2{font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}.num{text-align:right;white-space:nowrap}.tot td{font-weight:700;border-top:2px solid #333}.ok{color:#0a7a52}.warn{color:#c0392b}.muted{color:#777}</style></head><body><h2>Quit Timer · ${esc(statementTitle(s))}</h2><p class="muted">Printed ${new Date().toLocaleString('en-US')}</p>${statementTable(r)}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
  },
});

</script>

// sunrise (end of the Fajr window) with the same sun formulas as the prayer times
const sunriseMin = (() => {
  const LAT = 30.0444, LNG = 31.2357, rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;

function addOdo(km, time = Date.now()) { WRITE('quit_timer_budget', 'car_odo', JSON.stringify([...carOdo(), { time, km }])); }
const litresOf = (e, s) => e.amount / (e.lp || s.price);
function carCalc() {
  const s = carSettings(), odo = carOdo(), last = odo[odo.length - 1]; if (!last) return null;
  const fuel = expenses().filter(e => e.cat === 'FUEL').sort((a, b) => a.time - b.time);
  const kmAfter = fuel.filter(e => e.time > last.time).reduce((t, e) => t + litresOf(e, s) * s.kmPerL, 0);
  const calc = last.km + kmAfter, oilAt = s.oilAt != null ? s.oilAt : last.km, since = calc - oilAt;
  const intervals = [];
  for (let i = 1; i < odo.length; i++) {
    const a = odo[i - 1], b = odo[i], L = fuel.filter(e => e.time > a.time && e.time <= b.time).reduce((t, e) => t + litresOf(e, s), 0), km = b.km - a.km;
    if (L > 0 && km > 0) intervals.push({ time: b.time, kmPerL: km / L, km, L });
  }
  let suggest = null;
  const l2 = intervals.slice(-2);
  if (l2.length === 2) {
    const d = l2.map(x => (x.kmPerL - s.kmPerL) / s.kmPerL);
    if (d.every(x => Math.abs(x) > 0.08) && Math.sign(d[0]) === Math.sign(d[1])) { const v = Math.round((l2[0].kmPerL + l2[1].kmPerL) / 2 * 10) / 10; if (v !== s.ignored && v !== s.kmPerL) suggest = v; }
  }
  return { s, last, calc, diff: calc - last.km, oilAt, since, oilLeft: s.oilEvery - since, intervals, suggest };
}
function carMonth(m) { const s = carSettings(), l = expensesIn(m).filter(e => e.cat === 'FUEL' || e.cat === 'CAR'); return { spend: l.reduce((t, e) => t + e.amount, 0), km: l.filter(e => e.cat === 'FUEL').reduce((t, e) => t + litresOf(e, s) * s.kmPerL, 0), fuel: l.filter(e => e.cat === 'FUEL').reduce((t, e) => t + e.amount, 0) }; }

addExpense = function (amount, cat, method, time = Date.now(), note = '', sub = null) {

};

const km = v => Math.round(v).toLocaleString('en-US') + ' km';
function carCard(m) {

  if (!c) return card(`🚗 Car`, `<p class="small">First time: enter the odometer now and where it was at the last oil change.</p>
    <div class="row"><label>Odometer now <input type="number" id="car_now" min="0" style="width:120px"></label><label>At last oil change <input type="number" id="car_oil" min="0" style="width:120px"></label><button class="btn" data-act="carsetup">Save</button></div>

    <p class="muted small">Fuel ${s.price} EGP/L (92) · ${s.kmPerL} km/L. Log an Oil change as a Car expense and the counter starts again.</p></section>`;

    ${rows.map(e => `<tr class="clickable" data-act="editexp" data-arg="${e.id}"><td>${new Date(e.time).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })}</td><td>${e.cat === 'FUEL' ? 'Fuel' : 'Car · ' + esc(e.sub || 'Other')}${e.note ? ` <small class="muted">${esc(e.note)}</small>` : ''}</td><td class="num">${e.cat === 'FUEL' ? `${litresOf(e, s).toFixed(1)} L · ${km(litresOf(e, s) * s.kmPerL)}` : ''}</td><td class="num">${money(e.amount)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nothing yet.</td></tr>'}</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc, onSnapshot, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgVODfsYwTDfD717HH7Xkd5nfhK2Vi2y0",
  authDomain: "quit-sm-cfec3.firebaseapp.com",
  projectId: "quit-sm-cfec3",
  storageBucket: "quit-sm-cfec3.firebasestorage.app",
  messagingSenderId: "516854820795",
  appId: "1:516854820795:web:ba7d50d531a665e492de9e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch (e) { db = initializeFirestore(app, {}); }

const FILES = ["quit_timer", "quit_timer_tasks", "quit_timer_budget"];
let unsubs = [], uid = null, loaded = new Set();
let pending = 0, lastStatus = "Connecting…";
const setStatus = t => {
  lastStatus = t;
  const el = document.getElementById("status"), busy = (pending > 0 && !/Offline/.test(t)) || /Connecting|Signing/.test(t);
  el.innerHTML = (busy ? icon("loader-circle", "spin") : "") + (pending > 0 && !/error|Offline/i.test(t) ? "Syncing…" : t.replace("✓", "")) + (!busy && /Synced/.test(t) ? icon("check") : "");
  el.classList.toggle("ok", !busy && /Synced/.test(t));
};

// every change goes to the same document/field the phone uses
WRITE = (file, key, value) => {
  if (value === null || value === undefined) delete DATA[file][key]; else DATA[file][key] = value;
  if (!uid) return;
  pending++; setStatus(lastStatus);
  setDoc(doc(db, "users", uid, "prefs", file), { [key]: value == null ? deleteField() : value }, { merge: true })
    .then(() => { pending = Math.max(0, pending - 1); setStatus(lastStatus); })
    .catch(e => { pending = Math.max(0, pending - 1); setStatus("Sync error: " + e.message); });
};

document.getElementById("signin").onclick = () =>
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { document.getElementById("loginerr").textContent = e.message; });
document.getElementById("signout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set();
  uid = user ? user.uid : null;
  window.SIGNED_IN = !!user;
  document.getElementById("login").hidden = !!user;
  document.getElementById("app").hidden = !user;
  if (!user) return;
  document.getElementById("who").textContent = user.email || "";
  window.USER_NAME = (user.displayName || "").trim().split(" ")[0] || "";
  for (const f of FILES) {
    unsubs.push(onSnapshot(doc(db, "users", uid, "prefs", f), { includeMetadataChanges: true }, snap => {
      if (snap.metadata.hasPendingWrites) return;
      DATA[f] = snap.data() || {};
      if (!snap.metadata.fromCache) loaded.add(f);
      if (loaded.size === FILES.length && !window.SEEDED) {

      if (!document.querySelector("dialog") && !(a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName))) render();
    }, e => setStatus("Sync error: " + e.message)));
  }
  render();
});
